<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDRLv1Qt8omEwd2kSVRuvVYryaZk-Wy-7U",
    authDomain: "pew-production-dev.firebaseapp.com",
    projectId: "pew-production-dev",
    storageBucket: "pew-production-dev.firebasestorage.app",
    messagingSenderId: "844922053972",
    appId: "1:844922053972:web:87337a6b2d421fde74d4c1"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const COL = "factoryos";
  window.fbStorage = {
    async get(key) {
      try { const s = await getDoc(doc(db,COL,key)); return s.exists() ? s.data().value : null; } catch(e) { return null; }
    },
    async set(key, value) {
      try { await setDoc(doc(db,COL,key), {value, updatedAt: Date.now()}); return true; } catch(e) { return false; }
    },
    subscribe(key, cb) {
      return onSnapshot(doc(db,COL,key), s => cb(s.exists() ? s.data().value : null), e => console.error(e));
    }
  };
  window.__firebaseReady = true;
  window.dispatchEvent(new Event("firebase-ready"));
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Barlow:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0e13}
#root{
  --bg:#0c0e13;--bg2:#111318;--bg3:#181b23;--bg4:#1f2330;--bg5:#252a38;
  --border:#252a38;--border2:#2e3445;
  --accent:#00c8f0;--accent2:#ff5e2c;--accent3:#00d977;
  --day:#f0a500;--night:#7c82e0;--manual:#00d977;
  --warn:#f0a500;--danger:#ff3a3a;
  --text:#dde2ef;--text2:#7d849a;--text3:#454b60;
  --font:'Barlow',sans-serif;--mono:'IBM Plex Mono',monospace;
  --r:7px;--r2:10px;
  font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);min-height:100vh;
}
#root ::-webkit-scrollbar{width:4px;height:4px}
#root ::-webkit-scrollbar-track{background:transparent}
#root ::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}
.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:1.5rem;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:580px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
.modal-close{cursor:pointer;color:var(--text3);font-size:22px;border:none;background:none;line-height:1;padding:0 4px;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.modal-note{font-size:11px;color:var(--text2);margin-bottom:.875rem;line-height:1.6}
.field{margin-bottom:1rem}
.field label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:6px;font-family:var(--mono)}
.field input,.field select,.field textarea,.mi{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);padding:9px 12px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border .15s}
.mi{padding:6px 9px;font-size:11px}
.field input:focus,.field select:focus,.field textarea:focus,.mi:focus{border-color:var(--accent)}
.mi:disabled,.field select:disabled{opacity:.55;cursor:not-allowed}
.mi-row{display:flex;gap:6px}
.add-btn{flex:1;background:var(--accent2);border:none;border-radius:var(--r);padding:8px;color:#fff;font-family:var(--mono);font-size:10px;cursor:pointer;letter-spacing:.06em;text-align:center;transition:opacity .15s}
.add-btn:hover{opacity:.85}
.can-btn{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);padding:8px 14px;color:var(--text2);font-family:var(--mono);font-size:10px;cursor:pointer}
.save-msg{font-size:11px;color:var(--accent3);font-family:var(--mono);margin-top:.5rem}
.role-chips{display:flex;gap:7px;flex-wrap:wrap}
.role-chip{flex:1;min-width:80px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);padding:8px;cursor:pointer;text-align:center;font-size:11px;font-family:var(--mono);color:var(--text2);transition:all .15s}
.role-chip.active{background:#00c8f015;border-color:var(--accent);color:var(--accent)}
.small-btn{font-size:10px;padding:4px 8px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg4);color:var(--text2);cursor:pointer;font-family:var(--mono);transition:all .15s}
.small-btn:hover{color:var(--text);border-color:var(--text2)}
.small-btn.danger{color:var(--danger);border-color:#ff3a3a30}
.error-msg{font-size:11px;color:var(--danger);font-family:var(--mono);margin-bottom:8px}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}

.login-logo{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--accent);margin-bottom:2rem;display:flex;align-items:center;gap:8px}
.login-logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}

.topbar-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.live-clock{font-family:var(--mono);font-size:12px;color:var(--text2);letter-spacing:.05em}
.icon-btn{font-size:11px;color:var(--text3);cursor:pointer;padding:4px 9px;border-radius:var(--r);border:1px solid var(--border2);font-family:var(--mono);background:none;white-space:nowrap;transition:all .15s}
.icon-btn:hover{color:var(--text);border-color:var(--text2)}
.user-badge{display:flex;align-items:center;gap:7px;font-size:12px;border:none;background:none;color:var(--text)}
.user-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#000;flex-shrink:0}
.shift-banner{padding:5px 1.25rem;font-size:11px;font-family:var(--mono);display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--border2);flex-shrink:0;flex-wrap:wrap}
.sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-status{margin-left:auto;font-size:10px;padding:2px 8px;border-radius:3px;background:var(--bg4);letter-spacing:.08em}
.main-layout{display:grid;grid-template-columns:1fr 280px;flex:1}
@media(max-width:900px){.main-layout{grid-template-columns:1fr}}
.content-area{padding:1.125rem;display:flex;flex-direction:column;gap:1.125rem}
@media(max-width:760px){.content-area{padding:.75rem}}
.sidebar{background:var(--bg2);border-left:1px solid var(--border2);padding:1.125rem;display:flex;flex-direction:column;gap:1.125rem}
@media(max-width:900px){.sidebar{border-left:none;border-top:1px solid var(--border2)}}
@media(max-width:760px){.sidebar{padding:.75rem}}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:.875rem 1rem;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.s-run::before{background:var(--accent3)}.s-idle::before{background:var(--warn)}.s-down::before{background:var(--danger)}.s-eff::before{background:var(--accent)}

.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.625rem;flex-wrap:wrap;gap:6px}

.filter-row{display:flex;gap:4px;flex-wrap:wrap}
.fbtn{padding:3px 9px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:10px;cursor:pointer;font-family:var(--mono);transition:all .15s}
.fbtn.active{background:var(--bg5);color:var(--text)}
.machine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}

.m-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:9px;cursor:pointer;transition:border-color .2s,transform .15s;position:relative;overflow:hidden}

.m-card.selected{border-color:var(--accent);background:#00c8f00a}
.m-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.m-id{font-family:var(--mono);font-size:10px;color:var(--text3)}
.m-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.running .m-dot{background:var(--accent3);box-shadow:0 0 5px var(--accent3)}
.idle .m-dot{background:var(--warn)}
.breakdown .m-dot{background:var(--danger);box-shadow:0 0 5px var(--danger);animation:blink 1.3s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.m-name{font-size:11px;font-weight:600;margin-bottom:3px;line-height:1.3}
.m-badge{font-size:9px;font-family:var(--mono);padding:1px 5px;border-radius:3px;display:inline-block;margin-bottom:5px;letter-spacing:.04em}
.m-job{font-size:10px;color:var(--accent);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:13px;margin-bottom:4px}
.m-op{font-size:9px;color:var(--text2);font-family:var(--mono);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.m-prog-fill{height:100%;border-radius:2px;transition:width .6s}
.running .m-prog-fill{background:var(--accent3)}.idle .m-prog-fill{background:var(--warn)}.breakdown .m-prog-fill{background:var(--danger)}
.m-units{font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:3px;text-align:right}
.shift-done-tag{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;background:var(--bg5);color:var(--text2);display:inline-block;margin-top:4px}

.ob-label{font-size:10px;font-family:var(--mono);color:var(--text2);width:72px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.shift-compare{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);overflow:hidden}

.sc-row:hover{background:var(--bg4)}
.sc-row.active-view{background:var(--bg5)}
.sc-dot{width:8px;height:8px;border-radius:50%}
.sc-name{font-size:12px;font-weight:500}
.sc-time{font-size:10px;font-family:var(--mono);color:var(--text2);white-space:nowrap}
.sc-count{font-size:11px;font-family:var(--mono);color:var(--text2);text-align:right}
.sb-sec{display:flex;flex-direction:column}
.sb-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);font-family:var(--mono);margin-bottom:.625rem}
.m-detail{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:.875rem}

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;

const MACHINES_SEED = [

  assembly: {color:'#ff5e2c',bg:'#ff5e2c15',lbl:'ASSEMBLY'},
  dockchuck:{color:'#a0b0ff',bg:'#a0b0ff15',lbl:'DOCK CHUCK'},
};

const JOB_POOL = ['Shaft Batch #S1','Gear Profile #G4','Cam Cut #C7','Flange Set B','Drill Run #D3','Turn Series T2','Mill Block #M9','Plate Bend P1'];
const AC = {admin:'#ff5e2c',supervisor:'#00c8f0',operator:'#00d977'};

const DEFAULT_USERS = [
  {username:'admin',     password:'admin123',name:'Admin',     role:'admin',     shift:'day',    dailyWage:0},
  {username:'supervisor',password:'super123',name:'Supervisor',role:'supervisor',shift:'day',    dailyWage:0},
  {username:'operator1', password:'op123',   name:'Operator 1',role:'operator',  shift:'manual', dailyWage:500},
];

// A casting type is the raw cast-iron piece that arrives pre-cast from the foundry. It defines its
// own routing: an ordered, variable-length list of stages it must pass through before becoming a
// finished, sellable unit. Each stage names a MACHINE TYPE (not a specific machine) and carries its
// own target/rate/shiftHours, same shape as the old per-job fields, used for wage OT calculation.
const DEFAULT_CASTING_TYPES = [];

const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const randEl = a => a[rnd(0,a.length-1)];
const nowStr = () => { const n=new Date(); return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; };
const todayStr = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };
const fullTs = () => new Date().toISOString();
const isActive = s => SHIFT_CFG[s].check(new Date().getHours());
const initials = name => name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
// WIP key for "pieces ready to start stage N" of a casting type. Stage 1's input is raw stock
// (handled separately), so WIP keys only exist for stage indices 2..N.
const wipKey = (castingTypeId,nodeId) => `${castingTypeId}:${nodeId}`;
const getWip = (wip,castingTypeId,nodeId) => wip[wipKey(castingTypeId,nodeId)] || 0;
// Flattens a route's steps into every nodeId it touches, regardless of fixed/floating.
const routeNodeIds = r => (r.steps||[]).flatMap(s=>s.type==='fixed'?[s.nodeId]:(s.nodeIds||[]));
// Guarantees every casting type has valid nodes[]/routes[] arrays with routes carrying a proper
// steps[] sequence, regardless of what shape is sitting in Firestore — older test data may have
// the pre-routing {stages:[...]} format, or routes saved under the earlier flat {nodeIds:[...]}
// format before fixed/floating steps existed. Migrates flat nodeIds routes into all-fixed steps.
const normalizeCastingTypes = arr => (Array.isArray(arr)?arr:[]).map(ct=>({
  ...ct,
  nodes: Array.isArray(ct.nodes) ? ct.nodes : [],
  routes: Array.isArray(ct.routes) ? ct.routes.map(r=>{
    if(Array.isArray(r.steps)) return {...r,steps:r.steps.map(s=>s.type==='fixed'?{...s}:{type:'floating',nodeIds:Array.isArray(s.nodeIds)?s.nodeIds:[]})};
    if(Array.isArray(r.nodeIds)) return {...r,steps:r.nodeIds.map(nodeId=>({type:'fixed',nodeId}))};
    return {...r,steps:[]};
  }) : [],
}));
// Resolves a machine's assigned casting type + the specific route + node it's running, given
// castingTypeId/routeId/nodeId on the machine's shift slot. nodeId is the source of truth for WIP;
// routeId only matters for knowing what comes before/after this node along the chosen path.
const resolveStage = (castingTypes,m) => {
  const ct=castingTypes.find(c=>Number(c.id)===Number(m.castingTypeId));
  if(!ct||!Array.isArray(ct.nodes)||!Array.isArray(ct.routes)) return {ct:ct||null,stage:null,route:null};
  const node=m.nodeId!=null?ct.nodes.find(n=>Number(n.nodeId)===Number(m.nodeId)):null;
  const route=m.routeId!=null?ct.routes.find(r=>Number(r.routeId)===Number(m.routeId)):null;
  return {ct,stage:node,route};
};
// OT pay for a shift: only when produced exceeds target, converted via the stage's units/hour rate,
// paid at the operator's plain hourly rate (dailyWage/8) with no multiplier.
const calcOtPay = (produced,target,ratePerHour,dailyWage)=>{
  const extra=produced-target;
  if(extra<=0||!ratePerHour||!dailyWage) return {otHours:0,otPay:0};
  const otHours=extra/ratePerHour;
  const hourlyRate=dailyWage/8;
  return {otHours:Math.round(otHours*100)/100, otPay:Math.round(otHours*hourlyRate*100)/100};
};


function defaultSlot(){
  return {status:'idle',job:null,progress:0,output:0,operator:null,assignedOperator:null,
    castingTypeId:null,routeId:null,nodeId:null,prodCount:0,newPieces:0,reworkPieces:0,castingDefects:0,machiningDefects:0,shiftComplete:false,
    setupApplied:false,setupHoursUsed:0,adjustedTarget:null,settingApproved:false,lineInspection:null,
    settingApprovalStatus:null,settingRejectionNote:null};
}
// Returns the assignment slot for a given shiftKey ('day'|'night') on a cnc_vmc machine.
// Falls back to migrating pre-existing flat fields into the 'day' slot for machines saved before
// the day/night split existed, so no in-progress assignment is lost.
function getSlot(m,shiftKey){
  if(m.shift!=='cnc_vmc') return null;
  if(m.shifts&&m.shifts[shiftKey]) return m.shifts[shiftKey];
  if(shiftKey==='day'&&!m.shifts){
    return {
      status:m.status??'idle',job:m.job??null,progress:m.progress??0,output:m.output??0,
      operator:m.operator??null,assignedOperator:m.assignedOperator??null,
      castingTypeId:m.castingTypeId??null,routeId:m.routeId??null,nodeId:m.nodeId??null,prodCount:m.prodCount??0,newPieces:m.newPieces??0,reworkPieces:m.reworkPieces??0,
      castingDefects:m.castingDefects??0,machiningDefects:m.machiningDefects??0,
      shiftComplete:m.shiftComplete??false,setupApplied:m.setupApplied??false,setupHoursUsed:m.setupHoursUsed??0,
      adjustedTarget:m.adjustedTarget??null,settingApproved:m.settingApproved??false,lineInspection:m.lineInspection??null,
      settingApprovalStatus:m.settingApprovalStatus??null,settingRejectionNote:m.settingRejectionNote??null
    };
  }
  return defaultSlot();
}
// Merges a machine's base info with one shift's assignment slot, for display/read purposes.
function withShift(m,shiftKey){
  if(m.shift!=='cnc_vmc') return m;
  return {...m,...getSlot(m,shiftKey)};
}
// Immutably patches one machine's shift slot (or the flat machine for non-cnc_vmc machines).
function patchMachineShift(machines,machineId,shiftKey,patch){
  return machines.map(m=>{
    if(m.id!==machineId) return m;
    if(m.shift!=='cnc_vmc') return {...m,...patch};
    const current=getSlot(m,shiftKey);
    return {...m,shifts:{...(m.shifts||{}),[shiftKey]:{...current,...patch}}};
  });
}

function initMachines() {
  return MACHINES_SEED.map(def => {
    if(def.shift==='cnc_vmc'){
      return {...def, target: rnd(60,150), shifts:{day:defaultSlot(),night:defaultSlot()}};
    }
    const r = Math.random();
    const status = r<0.55?'running':r<0.78?'idle':'breakdown';
    return {
      ...def, status,
      job: status==='running'?randEl(JOB_POOL):null,
      progress: status==='running'?rnd(10,85):0,
      target: rnd(60,150),
      output: status==='running'?rnd(25,120):rnd(0,15),
      operator: `OP-${rnd(1,10)}`,
      castingTypeId:null, routeId:null, nodeId:null,
      prodCount:0, newPieces:0, reworkPieces:0, castingDefects:0, machiningDefects:0,
      shiftComplete:false, assignedOperator:null,
      setupApplied:false, setupHoursUsed:0, adjustedTarget:null,
    };
  });
}

const fb = {

}

// ── Login ──────────────────────────────────────────────────
function LoginScreen({users,onLogin}) {
  const [u,setU]=useState('');
  const [p,setP]=useState('');
  const [shift,setShift]=useState('day');
  const [err,setErr]=useState('');
  useEffect(()=>{
    const found=users.find(x=>x.username.toLowerCase()===u.trim().toLowerCase());
    if(found) setShift(found.shift||'day');
  },[u,users]);
  const login=()=>{
    setErr('');
    const found=users.find(x=>x.username.toLowerCase()===u.trim().toLowerCase());
    if(!found) return setErr('No account found.');
    if(found.password!==p) return setErr('Incorrect password.');
    onLogin({...found,shift});
  };
  return (
    <div className="login-screen">
      <div className="login-wrap">
        <div className="login-left">
          <div className="login-logo"><div className="login-logo-dot"></div>FactoryOS v3.2 — DEV BUILD</div>
          <h2>Sign in</h2>
          <p>Each worker has their own username and password. Contact your admin if you don't have one.</p>
          {err&&<div className="login-error">{err}</div>}
          <div className="field"><label>Username</label><input type="text" value={u} onChange={e=>setU(e.target.value)} placeholder="e.g. operator1"/></div>
          <div className="field"><label>Password</label><input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')login();}} placeholder="Password"/></div>
          <div className="field"><label>Shift today</label>
            <select value={shift} onChange={e=>setShift(e.target.value)}>
              <option value="day">CNC/VMC — Day (08:00–19:00)</option>
              <option value="night">CNC/VMC — Night (20:00–07:00)</option>
              <option value="manual">Manual/Labour (09:00–17:00)</option>
            </select>
          </div>
          <button className="login-btn" onClick={login}>SIGN IN →</button>
        </div>
        <div className="login-right">
          <div className="schedule-title">Shift schedule</div>
          {[{c:'#f0a500',n:'CNC/VMC — Day',t:'08:00–19:00',m:'CNC1·CNC2·CNC3·VMC1·VMC2'},
            {c:'#7c82e0',n:'CNC/VMC — Night',t:'20:00–07:00',m:'CNC1·CNC2·CNC3·VMC1·VMC2'},
            {c:'#00d977',n:'Manual/Labour — Day',t:'09:00–17:00',m:'Milling×3·Drilling×8·Lathe×4·Assembly×2·Dock Chuck×1'}
          ].map(s=>(
            <div className="sch-row" key={s.n}>
              <div className="sch-dot" style={{background:s.c,boxShadow:`0 0 6px ${s.c}`}}></div>
              <div><div className="sch-name">{s.n}</div><div className="sch-time">{s.t}</div><div className="sch-machines">{s.m}</div></div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── User Modal ─────────────────────────────────────────────
function UserModal({users,setUsers,currentUser,onClose}) {
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({username:'',password:'',name:'',role:'operator',shift:'day',dailyWage:''});
  const [msg,setMsg]=useState('');
  const save=async()=>{
    if(!form.username.trim()||!form.name.trim()) return setMsg('Username and name required.');
    const wage=form.dailyWage===''?0:Number(form.dailyWage);
    if(isNaN(wage)||wage<0) return setMsg('Daily wage must be a number 0 or greater.');
    let updated;
    if(editing==='new'){
      if(users.some(x=>x.username.toLowerCase()===form.username.trim().toLowerCase())) return setMsg('Username exists.');
      if(!form.password) return setMsg('Password required.');
      updated=[...users,{...form,username:form.username.trim(),dailyWage:wage}];
    } else {
      updated=users.map(x=>x.username!==editing?x:{...x,name:form.name,role:form.role,shift:form.shift,dailyWage:wage,password:form.password||x.password});
    }
    setUsers(updated); await fb.set('users',updated); setMsg('Saved.'); setEditing(null);
  };
  const remove=async uname=>{
    if(uname===currentUser.username) return setMsg("Can't delete yourself.");
    if(!window.confirm(`Remove "${uname}"?`)) return;
    const updated=users.filter(x=>x.username!==uname);
    setUsers(updated); await fb.set('users',updated);
  };
  return (
    <Modal onClose={onClose} title="User accounts">
      {!editing?(
        <>
          {users.map(u=>(
            <div className="user-row" key={u.username}>
              <div className="user-row-avatar" style={{background:AC[u.role]||'#888'}}>{initials(u.name)}</div>
              <div className="user-row-info">
                <div className="user-row-name">{u.name}{u.username===currentUser.username?' (you)':''}</div>
                <div className="user-row-meta">{u.username} · {u.role}{u.role==='operator'?` · ₹${u.dailyWage||0}/day`:''}</div>
              </div>
              <div className="user-row-actions">
                <button className="small-btn" onClick={()=>{setForm({username:u.username,password:'',name:u.name,role:u.role,shift:u.shift,dailyWage:u.dailyWage??''});setEditing(u.username);setMsg('');}}>Edit</button>
                <button className="small-btn danger" onClick={()=>remove(u.username)}>Remove</button>
              </div>
            </div>
          ))}
          <button className="add-btn" style={{marginTop:'.5rem'}} onClick={()=>{setForm({username:'',password:'',name:'',role:'operator',shift:'day',dailyWage:''});setEditing('new');setMsg('');}}>+ ADD USER</button>
          {msg&&<div className="save-msg">{msg}</div>}
        </>
      ):(
        <>
          <div className="field"><label>Username</label><input className="mi" value={form.username} disabled={editing!=='new'} onChange={e=>setForm({...form,username:e.target.value})} placeholder="e.g. operator2"/></div>
          <div className="field"><label>Full name</label><input className="mi" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Suresh Patel"/></div>
          <div className="field"><label>{editing==='new'?'Password':'New password (blank = keep current)'}</label><input className="mi" type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})}/></div>
          <div className="field"><label>Role</label>
            <div className="role-chips">{['admin','supervisor','operator'].map(r=><div key={r} className={`role-chip${form.role===r?' active':''}`} onClick={()=>setForm({...form,role:r})}>{r.charAt(0).toUpperCase()+r.slice(1)}</div>)}</div>
          </div>
          <div className="field"><label>Usual shift</label>
            <select className="mi" value={form.shift} onChange={e=>setForm({...form,shift:e.target.value})}>
              <option value="day">CNC/VMC — Day</option><option value="night">CNC/VMC — Night</option><option value="manual">Manual/Labour</option>
            </select>
          </div>
          <div className="field"><label>Daily wage (₹) — used for attendance &amp; overtime pay</label><input className="mi" type="number" min="0" value={form.dailyWage} onChange={e=>setForm({...form,dailyWage:e.target.value})} placeholder="e.g. 500"/></div>
          {msg&&<div className="save-msg" style={{color:'var(--danger)'}}>{msg}</div>}
          <div className="mi-row" style={{marginTop:'.5rem'}}><button className="add-btn" onClick={save}>SAVE</button><button className="can-btn" onClick={()=>setEditing(null)}>Cancel</button></div>
        </>
      )}
    </Modal>
  );
}

// ── Casting Types Modal ─────────────────────────────────────
function CastingTypesModal({castingTypes,setCastingTypes,onClose}) {
  const [editing,setEditing]=useState(null); // casting type id being edited, or 'new'
  const [form,setForm]=useState({name:'',unit:'pcs',rawBalance:0,lowThreshold:0});
  const [nodes,setNodes]=useState([]); // working copy of the node pool while editing a casting type
  const [routes,setRoutes]=useState([]); // working copy of routes (each an ordered list of steps)
  const [nodeForm,setNodeForm]=useState(null); // {editingId, name, machineType, target, shiftHours}
  const [routeForm,setRouteForm]=useState(null); // {editingId, name, steps:[{type:'fixed',nodeId}|{type:'floating',nodeIds:[]}]}
  const [msg,setMsg]=useState('');
  const dragIdx=useRef(null);
  const dragOverIdx=useRef(null);

  // Uses the global routeNodeIds helper (flattens fixed+floating steps into all referenced nodeIds).
  const persist=async updated=>{ setCastingTypes(updated); await fb.set('casting_types',updated); };

  const startNew=()=>{ setForm({name:'',unit:'pcs',rawBalance:0,lowThreshold:0}); setNodes([]); setRoutes([]); setEditing('new'); setMsg(''); };
  const startEdit=ct=>{
    setForm({name:ct.name,unit:ct.unit,rawBalance:ct.rawBalance,lowThreshold:ct.lowThreshold});
    setNodes(ct.nodes.map(n=>({...n})));
    setRoutes(ct.routes.map(r=>({...r,steps:r.steps.map(s=>s.type==='fixed'?{...s}:{...s,nodeIds:[...s.nodeIds]})})));
    setEditing(ct.id); setMsg('');
  };

  const saveType=async()=>{
    const name=form.name.trim();
    const balance=Number(form.rawBalance);
    const low=Number(form.lowThreshold);
    if(!name) return setMsg('Casting type name is required.');
    if(isNaN(balance)||balance<0) return setMsg('Starting balance must be 0 or greater.');
    if(isNaN(low)||low<0) return setMsg('Low-stock threshold must be 0 or greater.');
    if(!nodes.length) return setMsg('Add at least one operation to use in a route.');
    if(!routes.length) return setMsg('Add at least one route.');
    if(routes.some(r=>!r.steps.length)) return setMsg('Every route needs at least one step.');
    setMsg('Saving…');
    // Read the latest data straight from Firestore right before merging, rather than trusting the
    // castingTypes prop — the prop can be a render behind the live snapshot listener, which was
    // causing newly-added casting types to occasionally get overwritten by a stale merge.
    const latest=normalizeCastingTypes(await fb.get('casting_types').then(v=>v||castingTypes));
    const snapshot=[...latest];
    let updated;
    if(editing==='new'){
      const nextId=snapshot.length?Math.max(...snapshot.map(s=>s.id))+1:1;
      updated=[...snapshot,{id:nextId,name,unit:form.unit,rawBalance:balance,lowThreshold:low,nodes,routes}];
    } else {
      updated=snapshot.map(s=>s.id===editing?{...s,name,unit:form.unit,lowThreshold:low,nodes,routes}:s);
    }
    const ok=await fb.set('casting_types',updated);
    setCastingTypes(updated);
    setEditing(null);
    setMsg(ok?'':'Saved locally but Firebase sync failed. Check your connection.');
  };

  const removeType=async id=>{
    if(!window.confirm('Remove this casting type? Machines assigned to its routes will need a new assignment.')) return;
    await persist(castingTypes.filter(s=>s.id!==id));
  };

  const onDragEnd=async()=>{
    const from=dragIdx.current,to=dragOverIdx.current;
    if(from===null||to===null||from===to){dragIdx.current=null;dragOverIdx.current=null;return;}
    const updated=[...castingTypes];
    const [moved]=updated.splice(from,1);
    updated.splice(to,0,moved);
    dragIdx.current=null; dragOverIdx.current=null;
    await persist(updated);
  };

  const saveNode=()=>{
    const name=nodeForm.name.trim();
    const target=Number(nodeForm.target);
    const hours=Number(nodeForm.shiftHours);
    if(!name) return setMsg('Operation name is required.');
    if(!target||target<=0||isNaN(target)) return setMsg('Target must be a number greater than 0.');
    if(!hours||hours<=0||isNaN(hours)) return setMsg('Shift hours must be a number greater than 0.');
    const rate=target/hours;
    let updatedNodes;
    if(nodeForm.editingId===null){
      const nextId=nodes.length?Math.max(...nodes.map(n=>n.nodeId))+1:1;
      updatedNodes=[...nodes,{nodeId:nextId,name,machineType:nodeForm.machineType,target,ratePerHour:rate,shiftHours:hours}];
    } else {
      updatedNodes=nodes.map(n=>n.nodeId===nodeForm.editingId?{...n,name,machineType:nodeForm.machineType,target,ratePerHour:rate,shiftHours:hours}:n);
    }
    setNodes(updatedNodes);
    setNodeForm(null);
    setMsg('');
  };

  const removeNode=nodeId=>{
    const usedIn=routes.filter(r=>routeNodeIds(r).includes(nodeId));
    if(usedIn.length&&!window.confirm(`This operation is used in ${usedIn.length} route${usedIn.length>1?'s':''}. Removing it will also remove it from those routes. Continue?`)) return;
    setNodes(nodes.filter(n=>n.nodeId!==nodeId));
    setRoutes(routes.map(r=>({
      ...r,
      steps:r.steps
        .map(s=>s.type==='fixed'?s:{...s,nodeIds:s.nodeIds.filter(id=>id!==nodeId)})
        .filter(s=>s.type==='fixed'?s.nodeId!==nodeId:s.nodeIds.length>0)
    })));
  };

  const startNewRoute=()=>setRouteForm({editingId:null,name:'',steps:[]});
  const startEditRoute=r=>setRouteForm({editingId:r.routeId,name:r.name,steps:r.steps.map(s=>s.type==='fixed'?{...s}:{...s,nodeIds:[...s.nodeIds]})});

  const saveRoute=()=>{
    const name=routeForm.name.trim();
    if(!name) return setMsg('Route name is required.');
    if(!routeForm.steps.length) return setMsg('Add at least one step to the route.');
    const updatedRoute={routeId:routeForm.editingId===null?(routes.length?Math.max(...routes.map(r=>r.routeId))+1:1):routeForm.editingId,name,steps:routeForm.steps};
    let updatedRoutes;
    if(routeForm.editingId===null){
      updatedRoutes=[...routes,updatedRoute];
    } else {
      updatedRoutes=routes.map(r=>r.routeId===routeForm.editingId?updatedRoute:r);
    }
    setRoutes(updatedRoutes);
    setRouteForm(null);
    setMsg('');
  };

  const removeRoute=routeId=>{
    if(!window.confirm('Remove this route? Machines currently assigned via this route keep their current node, but cannot be re-assigned through it again.')) return;
    setRoutes(routes.filter(r=>r.routeId!==routeId));
  };

  // Adding a step: a fixed node becomes its own step; a floating node either starts a new floating
  // group (if the last step isn't already a floating group) or joins the existing trailing one.
  const addFixedStep=nodeId=>setRouteForm({...routeForm,steps:[...routeForm.steps,{type:'fixed',nodeId}]});
  const addFloatingStep=nodeId=>{
    const steps=[...routeForm.steps];
    const last=steps[steps.length-1];
    if(last&&last.type==='floating'){
      if(!last.nodeIds.includes(nodeId)) steps[steps.length-1]={...last,nodeIds:[...last.nodeIds,nodeId]};
    } else {
      steps.push({type:'floating',nodeIds:[nodeId]});
    }
    setRouteForm({...routeForm,steps});
  };
  const removeStep=idx=>setRouteForm({...routeForm,steps:routeForm.steps.filter((_,i)=>i!==idx)});
  const removeNodeFromFloatingStep=(stepIdx,nodeId)=>{
    const steps=[...routeForm.steps];
    const step=steps[stepIdx];
    const updatedIds=step.nodeIds.filter(id=>id!==nodeId);
    if(updatedIds.length) steps[stepIdx]={...step,nodeIds:updatedIds};
    else steps.splice(stepIdx,1);
    setRouteForm({...routeForm,steps});
  };

  // Which routes reference a given node, used to show "shared" hints in the route builder.
  const routesUsingNode=nodeId=>routes.filter(r=>routeNodeIds(r).includes(nodeId));

  return (
    <Modal onClose={onClose} title="Casting types &amp; routing" wide>
      {!editing?(
        <>
          <p className="modal-note">Each casting type arrives pre-cast from the foundry. Define the operations it can pass through, then one or more named routes through those operations — routes that share an operation share its work queue. Drag ⠿ to reorder casting types.</p>
          <div className="pj-list">
            {castingTypes.map((ct,i)=>(
              <div className="pj-row" key={ct.id} draggable
                onDragStart={()=>{dragIdx.current=i;}}
                onDragEnter={()=>{dragOverIdx.current=i;}}
                onDragEnd={onDragEnd}
                onDragOver={e=>e.preventDefault()}
                style={{cursor:'grab',userSelect:'none'}}>
                <div style={{color:'var(--text3)',fontFamily:'var(--mono)',fontSize:14,flexShrink:0}}>⠿</div>
                <div className="pj-info">
                  <div className="pj-name">{ct.name}</div>
                  <div className="pj-meta">{ct.routes.length} route{ct.routes.length!==1?'s':''}: {ct.routes.map(r=>r.name).join(', ')}</div>
                </div>
                <div className="pj-target" style={{color:ct.rawBalance<=ct.lowThreshold?'var(--danger)':'var(--text)'}}>{ct.rawBalance} {ct.unit}</div>
                <div className="pj-actions">
                  <button className="small-btn" onClick={()=>startEdit(ct)}>Edit</button>
                  <button className="small-btn danger" onClick={()=>removeType(ct.id)}>Remove</button>
                </div>
              </div>
            ))}
            {!castingTypes.length&&<div className="empty">No casting types yet</div>}
          </div>
          <button className="add-btn" style={{marginTop:'.75rem'}} onClick={startNew}>+ ADD CASTING TYPE</button>
          {msg&&<div className="save-msg">{msg}</div>}
        </>
      ):(
        <>
          <div className="field"><label>Casting type name</label><input className="mi" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Shaft Blank"/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <div className="field"><label>Unit</label>
              <select className="mi" value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})}>
                <option value="pcs">pcs</option><option value="kg">kg</option>
              </select>
            </div>
            <div className="field"><label>{editing==='new'?'Starting raw balance':'Current raw balance'}</label>
              <input className="mi" type="number" min="0" step="1" value={form.rawBalance} disabled={editing!=='new'} onChange={e=>setForm({...form,rawBalance:e.target.value})}/>
              {editing!=='new'&&<div style={{fontSize:10,color:'var(--text3)',marginTop:4,fontFamily:'var(--mono)'}}>Use Stock in / movement log to change balance</div>}
            </div>
          </div>
          <div className="field"><label>Low-stock alert threshold</label><input className="mi" type="number" min="0" value={form.lowThreshold} onChange={e=>setForm({...form,lowThreshold:e.target.value})}/></div>

          <div className="field">
            <label>Operations — the machine steps this casting can pass through</label>
            <div className="pj-list">
              {nodes.map(n=>(
                <div className="pj-row" key={n.nodeId}>
                  <div className="pj-info">
                    <div className="pj-name">{n.name}</div>
                    <div className="pj-meta">{BADGE[n.machineType]?.lbl||n.machineType.toUpperCase()} · {n.ratePerHour.toFixed(1)}/hr{routesUsingNode(n.nodeId).length>1?` · shared by ${routesUsingNode(n.nodeId).length} routes`:''}</div>
                  </div>
                  <div className="pj-target">{n.target}/shift</div>
                  <div className="pj-actions">
                    <button className="small-btn" onClick={()=>setNodeForm({editingId:n.nodeId,name:n.name,machineType:n.machineType,target:n.target,shiftHours:n.shiftHours})}>Edit</button>
                    <button className="small-btn danger" onClick={()=>removeNode(n.nodeId)}>Remove</button>
                  </div>
                </div>
              ))}
              {!nodes.length&&<div className="empty">No operations yet — add at least one</div>}
            </div>
            {!nodeForm&&<button className="add-btn" style={{marginTop:8}} onClick={()=>setNodeForm({editingId:null,name:'',machineType:'cnc',target:100,shiftHours:9})}>+ ADD OPERATION</button>}
          </div>

          {nodeForm&&(
            <div className="prod-entry">
              <div className="prod-entry-title">{nodeForm.editingId===null?'New operation':'Edit operation'}</div>
              <div className="field"><label>Operation name</label><input className="mi" value={nodeForm.name} onChange={e=>setNodeForm({...nodeForm,name:e.target.value})} placeholder="e.g. Rough turn"/></div>
              <div className="field"><label>Machine type</label>
                <select className="mi" value={nodeForm.machineType} onChange={e=>setNodeForm({...nodeForm,machineType:e.target.value})}>
                  {Object.keys(BADGE).map(t=><option key={t} value={t}>{BADGE[t].lbl}</option>)}
                </select>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <div className="field"><label>Full-shift target</label><input className="mi" type="number" min="1" value={nodeForm.target} onChange={e=>setNodeForm({...nodeForm,target:e.target.value})}/></div>
                <div className="field"><label>Shift hours</label><input className="mi" type="number" min="1" step="0.5" value={nodeForm.shiftHours} onChange={e=>setNodeForm({...nodeForm,shiftHours:e.target.value})}/></div>
              </div>
              {nodeForm.target&&nodeForm.shiftHours&&Number(nodeForm.target)>0&&Number(nodeForm.shiftHours)>0&&(
                <div className="info-box neutral" style={{marginBottom:'1rem'}}>Calculated rate: <b style={{color:'var(--text)'}}>{(Number(nodeForm.target)/Number(nodeForm.shiftHours)).toFixed(2)} units/hour</b></div>
              )}
              <div className="mi-row"><button className="add-btn" style={{background:'var(--accent)'}} onClick={saveNode}>SAVE OPERATION</button><button className="can-btn" onClick={()=>setNodeForm(null)}>Cancel</button></div>
            </div>
          )}

          <div className="field" style={{marginTop:'1.25rem'}}>
            <label>Routes — alternative paths through the operations above; routes sharing an operation share its queue</label>
            {!routeForm?(
              <>
                <div className="pj-list">
                  {routes.map(r=>(
                    <div className="pj-row" key={r.routeId} style={{alignItems:'flex-start'}}>
                      <div className="pj-info">
                        <div className="pj-name">{r.name}</div>
                        <div className="pj-meta">Raw → {r.steps.map(s=>s.type==='fixed'
                          ?(nodes.find(x=>x.nodeId===s.nodeId)||{}).name||'?'
                          :`[${s.nodeIds.map(id=>(nodes.find(x=>x.nodeId===id)||{}).name||'?').join(' / ')} — any order]`
                        ).join(' → ')} → Finished</div>
                      </div>
                      <div className="pj-actions">
                        <button className="small-btn" onClick={()=>startEditRoute(r)}>Edit</button>
                        <button className="small-btn danger" onClick={()=>removeRoute(r.routeId)}>Remove</button>
                      </div>
                    </div>
                  ))}
                  {!routes.length&&<div className="empty">No routes yet — add at least one</div>}
                </div>
                {!!nodes.length&&<button className="add-btn" style={{marginTop:8}} onClick={startNewRoute}>+ ADD ROUTE</button>}
                {!nodes.length&&<div style={{fontSize:10,color:'var(--text3)',marginTop:8,fontFamily:'var(--mono)'}}>Add at least one operation before building a route</div>}
              </>
            ):(
              <div className="prod-entry">
                <div className="prod-entry-title">{routeForm.editingId===null?'New route':'Edit route'}</div>
                <div className="field"><label>Route name</label><input className="mi" value={routeForm.name} onChange={e=>setRouteForm({...routeForm,name:e.target.value})} placeholder="e.g. Via lathe / Direct to CNC"/></div>
                <div className="field">
                  <label>Steps, in order — floating steps in the same box can happen in any order relative to each other</label>
                  <div style={{display:'flex',flexDirection:'column'}}>
                    <div className="pipe-node pipe-raw"><div style={{fontSize:11}}>Raw casting stock</div></div>
                    {routeForm.steps.map((step,i)=>{
                      if(step.type==='fixed'){
                        const n=nodes.find(x=>x.nodeId===step.nodeId);
                        const shared=routesUsingNode(step.nodeId).length>0&&routes.some(r=>r.routeId!==routeForm.editingId&&routeNodeIds(r).includes(step.nodeId));
                        return (
                          <React.Fragment key={i}>
                            <div className="pipe-arrow"><span>↓</span></div>
                            <div className="pj-row pipe-node">
                              <div className="pj-info">
                                <div className="pj-name">{n?n.name:'?'}{shared&&<span style={{color:'var(--accent)',fontSize:10,marginLeft:6}}>· shared queue</span>}</div>
                                <div className="pj-meta">{n?`${BADGE[n.machineType]?.lbl||n.machineType.toUpperCase()} · ${n.target}/shift · fixed position`:''}</div>
                              </div>
                              <button className="small-btn danger" onClick={()=>removeStep(i)}>Remove</button>
                            </div>
                          </React.Fragment>
                        );
                      }
                      return (
                        <React.Fragment key={i}>
                          <div className="pipe-arrow"><span>↓ unlocks floating group</span></div>
                          <div className="pj-row pipe-node" style={{borderStyle:'dashed',flexDirection:'column',alignItems:'stretch',gap:6}}>
                            <div style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--accent)',letterSpacing:'.06em',textTransform:'uppercase'}}>Floating — any order</div>
                            {step.nodeIds.map(nodeId=>{
                              const n=nodes.find(x=>x.nodeId===nodeId);
                              return (
                                <div key={nodeId} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                                  <div className="pj-info">
                                    <div className="pj-name" style={{fontSize:12}}>{n?n.name:'?'}</div>
                                    <div className="pj-meta">{n?`${BADGE[n.machineType]?.lbl||n.machineType.toUpperCase()} · ${n.target}/shift`:''}</div>
                                  </div>
                                  <button className="small-btn danger" onClick={()=>removeNodeFromFloatingStep(i,nodeId)}>Remove</button>
                                </div>
                              );
                            })}
                          </div>
                        </React.Fragment>
                      );
                    })}
                    <div className="pipe-arrow pipe-arrow-end"><span>↓ becomes finished units once every step is done</span></div>
                  </div>
                  <div style={{marginTop:8,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                    <div>
                      <label style={{display:'block',fontSize:10,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--text2)',marginBottom:6,fontFamily:'var(--mono)'}}>Add fixed step</label>
                      <div className="role-chips">
                        {nodes.map(n=><div key={n.nodeId} className="role-chip" onClick={()=>addFixedStep(n.nodeId)}>{n.name}</div>)}
                      </div>
                    </div>
                    <div>
                      <label style={{display:'block',fontSize:10,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--text2)',marginBottom:6,fontFamily:'var(--mono)'}}>Add floating step</label>
                      <div className="role-chips">
                        {nodes.map(n=><div key={n.nodeId} className="role-chip" onClick={()=>addFloatingStep(n.nodeId)}>{n.name}</div>)}
                      </div>
                      <div style={{fontSize:10,color:'var(--text3)',marginTop:4,fontFamily:'var(--mono)'}}>Adds to the floating group at the end of the route, or starts a new one</div>
                    </div>
                  </div>
                </div>
                {msg&&<div className="save-msg" style={{color:'var(--danger)'}}>{msg}</div>}
                <div className="mi-row"><button className="add-btn" style={{background:'var(--accent)'}} onClick={saveRoute}>SAVE ROUTE</button><button className="can-btn" onClick={()=>setRouteForm(null)}>Cancel</button></div>
              </div>
            )}
          </div>

          {msg&&!routeForm&&<div className="save-msg" style={{color:msg.includes('failed')?'var(--warn)':msg.includes('required')||msg.includes('greater')||msg.includes('Add at least')?'var(--danger)':'var(--accent3)'}}>{msg}</div>}
          <div className="mi-row" style={{marginTop:'.5rem'}}><button className="add-btn" onClick={saveType}>SAVE CASTING TYPE</button><button className="can-btn" onClick={()=>setEditing(null)}>Cancel</button></div>
        </>
      )}
    </Modal>
  );
}

// ── Stock Modal ────────────────────────────────────────────
function StockModal({castingTypes,setCastingTypes,wip,setWip,stockLog,setStockLog,onClose}) {
  const [inForm,setInForm]=useState({typeId:'',qty:'',supplier:'',note:''});
  const [inMsg,setInMsg]=useState('');
  const [tab,setTab]=useState('balances');

  const persistTypes=async updated=>{ setCastingTypes(updated); await fb.set('casting_types',updated); };
  const persistLog=async updated=>{ setStockLog(updated); await fb.set('stock_log',updated); };

  const logIn=async()=>{
    setInMsg('');
    const qty=Number(inForm.qty);
    if(!inForm.typeId) return setInMsg('Select a casting type.');
    if(!qty||qty<=0||isNaN(qty)) return setInMsg('Quantity must be a number greater than 0.');
    const ct=castingTypes.find(s=>s.id===Number(inForm.typeId));
    if(!ct) return setInMsg('Casting type not found.');
    const updatedTypes=castingTypes.map(s=>s.id===ct.id?{...s,rawBalance:Math.round((s.rawBalance+qty)*100)/100}:s);
    const entry={id:Date.now(),type:'in',itemId:ct.id,itemName:ct.name,unit:ct.unit,qty,supplier:inForm.supplier.trim(),note:inForm.note.trim(),date:todayStr(),time:nowStr(),ts:fullTs()};
    await persistTypes(updatedTypes);
    await persistLog([entry,...stockLog].slice(0,500));
    setInForm({typeId:inForm.typeId,qty:'',supplier:'',note:''});
    setInMsg('Stock added.');
  };

  const recentLog=stockLog.slice(0,40);

  return (
    <Modal onClose={onClose} title="Stock control" wide>
      <div className="role-chips" style={{marginBottom:'1rem'}}>
        <div className={`role-chip${tab==='balances'?' active':''}`} onClick={()=>setTab('balances')}>Balances</div>
        <div className={`role-chip${tab==='in'?' active':''}`} onClick={()=>setTab('in')}>Stock in</div>
        <div className={`role-chip${tab==='log'?' active':''}`} onClick={()=>setTab('log')}>Movement log</div>
      </div>

      {tab==='balances'&&(
        <>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <p className="modal-note" style={{margin:0}}>Shows pieces at each stage of the pipeline. After an operation completes, good output appears below that operation — ready for the next step.</p>
            <button className="small-btn danger" style={{flexShrink:0,marginLeft:8}} onClick={async()=>{
              if(!window.confirm('Reset all WIP counts to zero? This clears stale data from deleted casting types. Current casting stock balances are not affected.')) return;
              setWip({}); await fb.set('wip',{});
            }}>Reset WIP</button>
          </div>
          {castingTypes.map(ct=>(
            <div key={ct.id} style={{marginBottom:18}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:6}}>{ct.name}</div>
              <div className="pipe-node pipe-raw">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--text2)',textTransform:'uppercase',letterSpacing:'.06em'}}>Raw casting stock</div>
                    <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>Low-stock alert under {ct.lowThreshold} {ct.unit}</div>
                  </div>
                  <div style={{fontSize:14,fontWeight:500,color:ct.rawBalance<=ct.lowThreshold?'var(--danger)':'var(--text)'}}>{ct.rawBalance} {ct.unit}</div>
                </div>
              </div>
              {ct.nodes.map(n=>{
                const routesHere=ct.routes.filter(r=>routeNodeIds(r).includes(Number(n.nodeId)));
                // WIP key ctId:nodeId = pieces that have completed the PREVIOUS step and are
                // waiting to enter THIS operation. So it displays BEFORE the operation arrow,
                // not after it — i.e. "X pieces ready for Face-OD" sits between Bore and Face-OD.
                const wipCount=getWip(wip,ct.id,n.nodeId);
                // Only show the WIP row if it's not the first node in every route (first nodes
                // pull from raw stock, not from a prior WIP pool, so there's nothing to show).
                const isFirstNodeInAnyRoute=ct.routes.some(r=>{
                  const ids=r.steps.flatMap(s=>s.type==='fixed'?[Number(s.nodeId)]:s.nodeIds.map(Number));
                  return ids[0]===Number(n.nodeId);
                });
                return (
                  <React.Fragment key={n.nodeId}>
                    {!isFirstNodeInAnyRoute&&(
                      <div className="pipe-node pipe-raw" style={{opacity:.85}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <div style={{fontSize:11,color:'var(--text2)'}}>Ready for {n.name}</div>
                          <div style={{fontSize:12,color:wipCount>0?'var(--accent3)':'var(--text3)'}}>{wipCount} {ct.unit}</div>
                        </div>
                      </div>
                    )}
                    <div className="pipe-arrow"><span>↓ {n.name} ({BADGE[n.machineType]?.lbl||n.machineType.toUpperCase()}){routesHere.length>1?` · via ${routesHere.map(r=>r.name).join(' / ')}`:''}</span></div>
                  </React.Fragment>
                );
              })}
              <div className="pipe-arrow pipe-arrow-end"><span>↓ each route's final step becomes finished units</span></div>
            </div>
          ))}
          {!castingTypes.length&&<div className="empty">No casting types yet — add one in Casting types</div>}
        </>
      )}

      {tab==='in'&&(
        <>
          <p className="modal-note">Record pre-cast material received from the foundry. This adds directly to the casting type's raw balance.</p>
          <div className="field"><label>Casting type</label>
            <select className="mi" value={inForm.typeId} onChange={e=>setInForm({...inForm,typeId:e.target.value})}>
              <option value="">— Select casting type —</option>
              {castingTypes.map(s=><option key={s.id} value={s.id}>{s.name} ({s.rawBalance} {s.unit} in stock)</option>)}
            </select>
          </div>
          <div className="field"><label>Quantity received {inForm.typeId?`(${(castingTypes.find(s=>s.id===Number(inForm.typeId))||{}).unit||''})`:''}</label>
            <input className="mi" type="number" min="0" step="1" value={inForm.qty} onChange={e=>setInForm({...inForm,qty:e.target.value})} placeholder="e.g. 100"/>
          </div>
          <div className="field"><label>Supplier / foundry (optional)</label><input className="mi" value={inForm.supplier} onChange={e=>setInForm({...inForm,supplier:e.target.value})} placeholder="e.g. Rajasthan Foundry Co."/></div>
          <div className="field"><label>Note (optional)</label><input className="mi" value={inForm.note} onChange={e=>setInForm({...inForm,note:e.target.value})} placeholder="e.g. PO #4521"/></div>
          {inMsg&&<div className="save-msg" style={{color:inMsg.includes('Select')||inMsg.includes('greater')?'var(--danger)':'var(--accent3)'}}>{inMsg}</div>}
          <button className="add-btn" onClick={logIn}>+ ADD STOCK</button>
        </>
      )}

      {tab==='log'&&(
        <>
          <p className="modal-note">Most recent 40 stock movements — manual stock-in plus automatic deductions and defects from completed shifts.</p>
          <div className="alert-list">
            {!recentLog.length?<div className="empty">No stock movements logged yet</div>:recentLog.map(e=>(
              <div className={`al-item${e.type==='out'||e.type==='defect'?' warn':' info'}`} key={e.id}>
                <div>
                  <div className="al-msg">{e.type==='in'?'+':'−'}{e.qty} {e.unit} · {e.itemName}{e.stageLabel?` · ${e.stageLabel}`:''}{e.type==='out'&&e.machine?` · ${e.machine}`:''}{e.supplier?` · ${e.supplier}`:''}{e.note?` · ${e.note}`:''}</div>
                  <div className="al-time">{e.date} {e.time}</div>
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </Modal>
  );
}


function AssignModal({machines,setMachines,users,castingTypes,wip,onClose}) {
  const [selM,setSelM]=useState('');
  const [selOp,setSelOp]=useState('');
  const [selCt,setSelCt]=useState('');
  const [selRouteId,setSelRouteId]=useState('');
  const [selNodeId,setSelNodeId]=useState('');
  const [needsSetup,setNeedsSetup]=useState(false);
  const [setupHours,setSetupHours]=useState(2);
  const [selShift,setSelShift]=useState('day');
  const [msg,setMsg]=useState('');
  const operators=users.filter(u=>u.role==='operator');
  const cncVmc=machines.filter(m=>m.shift==='cnc_vmc').map(m=>withShift(m,selShift));
  const manualMachines=machines.filter(m=>m.shift==='manual');
  // All assignable machines: CNC/VMC (day/night slot aware) + manual (flat single slot)
  const allAssignable=[...cncVmc,...manualMachines];
  const mObj=allAssignable.find(m=>m.id===selM);
  const ctObj=castingTypes.find(c=>Number(c.id)===Number(selCt));
  const routeObj=ctObj&&selRouteId?ctObj.routes.find(r=>Number(r.routeId)===Number(selRouteId)):null;
  // Every node referenced by this route, coerced to numbers for safe comparison.
  const routeAllNodeIds=routeObj?routeNodeIds(routeObj).map(Number):[];
  const eligibleNodes=routeAllNodeIds.map(id=>ctObj.nodes.find(n=>Number(n.nodeId)===id)).filter(n=>n&&mObj&&n.machineType===mObj.type);
  const nodeObj=ctObj&&selNodeId?ctObj.nodes.find(n=>Number(n.nodeId)===Number(selNodeId)):null;
  const eligibleCastingTypes=mObj?castingTypes.filter(ct=>ct.routes.some(r=>routeNodeIds(r).some(id=>{const n=ct.nodes.find(x=>Number(x.nodeId)===Number(id));return n&&n.machineType===mObj.type;}))):[];
  const eligibleRoutes=ctObj&&mObj?ctObj.routes.filter(r=>routeNodeIds(r).some(id=>{const n=ctObj.nodes.find(x=>Number(x.nodeId)===Number(id));return n&&n.machineType===mObj.type;})):[];
  useEffect(()=>{setSelCt('');setSelRouteId('');setSelNodeId('');setNeedsSetup(false);setSetupHours(2);},[selM,selShift]);
  useEffect(()=>{setSelRouteId('');setSelNodeId('');setNeedsSetup(false);setSetupHours(2);},[selCt]);
  useEffect(()=>{setSelNodeId('');setNeedsSetup(false);setSetupHours(2);},[selRouteId]);

  // Finds which step (and, for floating steps, whether the node sits in a floating group) the
  // selected node belongs to in this route — needed to work out where its input comes from.
  const stepInfo=(()=>{
    if(!routeObj||!nodeObj) return null;
    const nodeIdN=Number(nodeObj.nodeId);
    for(let i=0;i<routeObj.steps.length;i++){
      const step=routeObj.steps[i];
      if(step.type==='fixed'&&Number(step.nodeId)===nodeIdN) return {index:i,step,isFloating:false};
      if(step.type==='floating'&&step.nodeIds.map(Number).includes(nodeIdN)) return {index:i,step,isFloating:true};
    }
    return null;
  })();
  const isFirstStep=stepInfo?stepInfo.index===0:false;

  // Input for the chosen node: raw casting stock if it's the very first step in the route. Otherwise,
  // for a fixed step it pulls from the WIP left by whatever came immediately before (a single node if
  // fixed, or the floating gate if the previous step was a floating group). For a floating step, every
  // node in that group shares the SAME input WIP (whatever unlocked the group) — but each node tracks
  // its OWN completed count separately, since a count alone can't tell which individual pieces still
  // need which floating operation.
  const availableInput=(()=>{
    if(!routeObj||!nodeObj||!stepInfo) return null;
    if(isFirstStep) return ctObj.rawBalance;
    const prevStep=routeObj.steps[stepInfo.index-1];
    if(prevStep.type==='fixed') return getWip(wip,ctObj.id,prevStep.nodeId);
    // Previous step was a floating group: its "release" WIP key is keyed by the group's gate id —
    // we use the first nodeId in that floating group as a stable gate identifier.
    return getWip(wip,ctObj.id,`gate:${prevStep.nodeIds[0]}`);
  })();

  const hasRate=nodeObj&&nodeObj.ratePerHour&&nodeObj.shiftHours;
  const adjustedTarget=hasRate&&needsSetup
    ? Math.max(0, Math.round(nodeObj.ratePerHour * Math.max(0, nodeObj.shiftHours - Number(setupHours||0))))
    : nodeObj ? nodeObj.target : null;

  const assign=async()=>{
    if(!selM||!selOp||!selCt||!selRouteId||!selNodeId) return setMsg('Select machine, operator, casting type, route, and step.');
    if(needsSetup&&!hasRate) return setMsg('This operation has no units/hour rate set — edit it in Casting types first, or turn off setup adjustment.');
    const opUser=users.find(u=>u.username===selOp);
    const finalTarget=needsSetup&&hasRate?adjustedTarget:nodeObj.target;
    const updated=patchMachineShift(machines,selM,selShift,{
      castingTypeId:Number(selCt),routeId:Number(selRouteId),nodeId:Number(selNodeId),prodCount:0,newPieces:0,reworkPieces:0,castingDefects:0,machiningDefects:0,shiftComplete:false,
      assignedOperator:selOp,operator:opUser?opUser.name:selOp,status:'running',progress:0,output:0,
      setupApplied:needsSetup,setupHoursUsed:needsSetup?Number(setupHours):0,adjustedTarget:needsSetup?finalTarget:null,
      settingApproved:false,lineInspection:null,settingApprovalStatus:null,settingRejectionNote:null
    });
    setMachines(updated); await fb.set('machines',updated);
    setMsg('Assigned!'); setSelM(''); setSelOp(''); setSelCt(''); setSelRouteId(''); setSelNodeId(''); setNeedsSetup(false); setSetupHours(2);
  };
  const clear=async mid=>{
    const updated=patchMachineShift(machines,mid,selShift,{assignedOperator:null});
    setMachines(updated); await fb.set('machines',updated);
  };
  const active=allAssignable.filter(m=>m.assignedOperator);
  const opAssignmentCounts={};
  active.forEach(m=>{ opAssignmentCounts[m.assignedOperator]=(opAssignmentCounts[m.assignedOperator]||0)+1; });

  return (
    <Modal onClose={onClose} title="Assign jobs" wide>
      <p className="modal-note">Assign an operator to any machine for one step of a chosen route. For CNC/VMC machines, day and night shift assignments are kept separate — select the shift first. Manual machines run a single shift only, so the shift toggle below only applies to CNC/VMC.</p>
      {mObj&&mObj.shift==='manual'&&<div className="info-box neutral" style={{marginBottom:'1rem',fontSize:11}}>Manual machine — single shift, no line inspection required.</div>}
      <div className="field"><label>Shift</label>
        <div className="role-chips">
          <div className={`role-chip${selShift==='day'?' active':''}`} onClick={()=>setSelShift('day')}>☀ Day shift</div>
          <div className={`role-chip${selShift==='night'?' active':''}`} onClick={()=>setSelShift('night')}>🌙 Night shift</div>
        </div>
      </div>
      <div className="field"><label>Machine</label>
        <select className="mi" value={selM} onChange={e=>setSelM(e.target.value)}>
          <option value="">— Select machine —</option>
          {allAssignable.map(m=><option key={m.id} value={m.id}>{m.id} · {m.name} ({BADGE[m.type].lbl}){m.shift==='manual'?' · manual shift':''}{m.assignedOperator?` — ${m.operator}`:''}</option>)}
        </select>
      </div>
      <div className="field"><label>Operator</label>
        <select className="mi" value={selOp} onChange={e=>setSelOp(e.target.value)}>
          <option value="">— Select operator —</option>
          {operators.map(o=><option key={o.username} value={o.username}>{o.name} ({o.username}){opAssignmentCounts[o.username]?` — already on ${opAssignmentCounts[o.username]} machine${opAssignmentCounts[o.username]>1?'s':''}`:''}</option>)}
        </select>
        {!operators.length&&<div style={{fontSize:10,color:'var(--text3)',marginTop:4,fontFamily:'var(--mono)'}}>No operator accounts — add via Manage users</div>}
      </div>
      <div className="field"><label>Casting type</label>
        <select className="mi" value={selCt} disabled={!selM} onChange={e=>setSelCt(e.target.value)}>
          <option value="">— Select casting type —</option>
          {eligibleCastingTypes.map(ct=><option key={ct.id} value={ct.id}>{ct.name}</option>)}
        </select>
        {selM&&!eligibleCastingTypes.length&&<div style={{fontSize:10,color:'var(--text3)',marginTop:4,fontFamily:'var(--mono)'}}>No casting types route through {mObj&&BADGE[mObj.type].lbl} yet</div>}
      </div>
      {selCt&&(
        <div className="field"><label>Route</label>
          <select className="mi" value={selRouteId} onChange={e=>setSelRouteId(e.target.value)}>
            <option value="">— Select route —</option>
            {eligibleRoutes.map(r=><option key={r.routeId} value={r.routeId}>{r.name} ({r.steps.map(s=>s.type==='fixed'?(ctObj.nodes.find(x=>x.nodeId===s.nodeId)||{}).name||'?':`[${s.nodeIds.map(id=>(ctObj.nodes.find(x=>x.nodeId===id)||{}).name||'?').join('/')}]`).join(' → ')})</option>)}
          </select>
          {!eligibleRoutes.length&&<div style={{fontSize:10,color:'var(--text3)',marginTop:4,fontFamily:'var(--mono)'}}>No route for this casting type uses {mObj&&BADGE[mObj.type].lbl}</div>}
        </div>
      )}
      {selRouteId&&(
        <div className="field"><label>Step</label>
          <select className="mi" value={selNodeId} onChange={e=>setSelNodeId(e.target.value)}>
            <option value="">— Select step —</option>
            {eligibleNodes.map(n=>{
              const inFloating=routeObj.steps.some(s=>s.type==='floating'&&s.nodeIds.map(Number).includes(Number(n.nodeId)));
              return <option key={n.nodeId} value={n.nodeId}>{n.name} ({n.target}/shift){inFloating?' · floating':''}</option>;
            })}
          </select>
          {!eligibleNodes.length&&<div style={{fontSize:10,color:'var(--text3)',marginTop:4,fontFamily:'var(--mono)'}}>This route has no step on {mObj&&BADGE[mObj.type].lbl}</div>}
        </div>
      )}

      {nodeObj&&stepInfo&&(
        <div className="info-box neutral" style={{marginBottom:'1rem'}}>
          {isFirstStep?'Pulls from raw casting stock':stepInfo.isFloating?'Pulls from the floating group\'s shared pool (any floating step in this group can be done in any order)':'Pulls from WIP left by the previous step'}: <b style={{color:'var(--text)'}}>{availableInput} {ctObj.unit} available</b>
          {availableInput<nodeObj.target&&<div style={{marginTop:4,color:'var(--warn)'}}>⚠ Less input available than this operation's full-shift target — operator may run out mid-shift.</div>}
        </div>
      )}

      {nodeObj&&(
        <div className="field">
          <label>Machine setting / setup needed?</label>
          <div className="role-chips">
            <div className={`role-chip${!needsSetup?' active':''}`} onClick={()=>setNeedsSetup(false)}>No — full shift target</div>
            <div className={`role-chip${needsSetup?' active':''}`} onClick={()=>setNeedsSetup(true)}>Yes — needs setup</div>
          </div>
        </div>
      )}

      {nodeObj&&needsSetup&&(
        <div className="field">
          <label>Setup hours (default 2 — increase if longer setup expected)</label>
          <input className="mi" type="number" min="0" step="0.5" value={setupHours} onChange={e=>setSetupHours(e.target.value)}/>
          {hasRate?(
            <div className="info-box neutral" style={{marginTop:8,marginBottom:0}}>
              {nodeObj.shiftHours}hr shift − {setupHours||0}hr setup = {Math.max(0,nodeObj.shiftHours-Number(setupHours||0)).toFixed(1)}hr production<br/>
              Adjusted target: <b style={{color:'var(--text)'}}>{adjustedTarget} units</b> (at {nodeObj.ratePerHour}/hr) instead of {nodeObj.target}
            </div>
          ):(
            <div className="info-box danger" style={{marginTop:8,marginBottom:0}}>This operation has no units/hour rate set. Edit it in Casting types to enable auto-adjusted targets, or assign without setup.</div>
          )}
        </div>
      )}

      {msg&&<div className="save-msg" style={{color:msg.includes('Select')||msg.includes('rate')?'var(--danger)':'var(--accent3)'}}>{msg}</div>}
      <button className="add-btn" onClick={assign}>ASSIGN →</button>

      {active.length>0&&(
        <>
          <div className="sb-title" style={{marginTop:'1.25rem'}}>Current assignments — {selShift==='day'?'Day shift':'Night shift'}</div>
          {Object.entries(
            active.reduce((acc,m)=>{ (acc[m.assignedOperator]=acc[m.assignedOperator]||[]).push(m); return acc; },{})
          ).map(([opUsername,opMachines])=>(
            <div key={opUsername} style={{marginBottom:8}}>
              <div style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--text2)',marginBottom:4}}>{opMachines[0].operator}{opMachines.length>1?` (${opMachines.length} machines)`:''}</div>
              {opMachines.map(m=>{
                const ct=castingTypes.find(c=>Number(c.id)===Number(m.castingTypeId));
                const route=ct&&m.routeId?ct.routes.find(r=>Number(r.routeId)===Number(m.routeId)):null;
                const node=ct&&m.nodeId?ct.nodes.find(n=>Number(n.nodeId)===Number(m.nodeId)):null;
                return (
                  <div className="pj-row" key={m.id} style={{marginBottom:4}}>
                    <div className="pj-info">
                      <div className="pj-name">{m.id}{m.setupApplied?' · setup applied':''}</div>
                      <div className="pj-meta">{ct?`${ct.name} — ${route?route.name:'—'} (${node?node.name:'—'})`:'—'}{m.setupApplied?` · target ${m.adjustedTarget}`:''}</div>
                    </div>
                    <button className="small-btn danger" onClick={()=>clear(m.id)}>Clear</button>
                  </div>
                );
              })}
            </div>
          ))}
        </>
      )}
    </Modal>
  );
}

// ── Online Modal ───────────────────────────────────────────
function OnlineModal({sessions,sid,onClose}) {
  const now=Date.now();
  const list=Object.entries(sessions||{}).map(([id,s])=>({id,...s})).filter(s=>now-s.lastSeen<=120000).sort((a,b)=>b.lastSeen-a.lastSeen);
  return (
    <Modal onClose={onClose} title="Online now">
      <p className="modal-note">Workers currently signed in across all devices. Updates every 30 seconds.</p>
      {!list.length?<div className="empty">No one else online</div>:list.map(s=>(
        <div className="user-row" key={s.id}>
          <div className="user-row-avatar" style={{background:AC[s.role]||'#888'}}>{initials(s.name)}</div>
          <div className="user-row-info"><div className="user-row-name">{s.name}{s.id===sid?' (you)':''}</div><div className="user-row-meta">{s.username} · {s.role}</div></div>
          <span style={{fontSize:10,padding:'2px 7px',borderRadius:10,background:'#00d97720',color:'var(--accent3)',fontFamily:'var(--mono)',flexShrink:0}}>● online</span>
        </div>

}

// ── Shift Complete Modal ───────────────────────────────────
function ShiftCompleteModal({machine,pj,onSubmit,onClose}) {
  const hasLog=machine.prodCount>0||machine.newPieces>0||machine.reworkPieces>0||machine.castingDefects>0||machine.machiningDefects>0;
  const [newP,setNewP]=useState(hasLog?String(machine.newPieces||0):'');
  const [reworkP,setReworkP]=useState(hasLog?String(machine.reworkPieces||0):'');
  const [castDef,setCastDef]=useState(hasLog?String(machine.castingDefects||0):'');
  const [machDef,setMachDef]=useState(hasLog?String(machine.machiningDefects||0):'');
  const [reason,setReason]=useState('');
  const [err,setErr]=useState('');
  const good=(Number(newP)||0)+(Number(reworkP)||0);
  const consumed=good+(Number(castDef)||0)+(Number(machDef)||0);
  const filled=newP!==''&&reworkP!==''&&castDef!==''&&machDef!=='';
  const isBelow=filled&&good<pj.target;
  const isMet=filled&&good>=pj.target;
  const submit=()=>{
    setErr('');
    if(!filled) return setErr('Enter all four counts (use 0 if none).');
    if([newP,reworkP,castDef,machDef].some(v=>Number(v)<0)) return setErr('Counts cannot be negative.');
    if(isBelow&&!reason.trim()) return setErr('Reason required when below target.');
    onSubmit({newPieces:Number(newP),reworkPieces:Number(reworkP),castingDefects:Number(castDef),machiningDefects:Number(machDef),total:good,consumed,reason:reason.trim()});
  };
  return (
    <Modal onClose={onClose} title="Mark shift complete">
      <div className="info-box neutral" style={{marginBottom:'1rem'}}>
        <div>{machine.name} · {pj.name}</div>
        <div style={{marginTop:2}}>Target: <b style={{color:'var(--text)'}}>{pj.target} units</b></div>
        {hasLog&&<div style={{marginTop:2,fontSize:10,color:'var(--text2)'}}>Carried over from last logged progress — update if more was produced since then.</div>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
        <div className="field" style={{marginBottom:0}}><label>New pieces</label><input className="mi" type="number" min="0" placeholder="0" value={newP} onChange={e=>setNewP(e.target.value)}/></div>
        <div className="field" style={{marginBottom:0}}><label>Rework pieces</label><input className="mi" type="number" min="0" placeholder="0" value={reworkP} onChange={e=>setReworkP(e.target.value)}/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:'1rem'}}>
        <div className="field" style={{marginBottom:0}}><label>Casting defect</label><input className="mi" type="number" min="0" placeholder="0" value={castDef} onChange={e=>setCastDef(e.target.value)}/></div>
        <div className="field" style={{marginBottom:0}}><label>Machining defect</label><input className="mi" type="number" min="0" placeholder="0" value={machDef} onChange={e=>setMachDef(e.target.value)}/></div>
      </div>
      {filled&&(
        <div className={`info-box${isBelow?' danger':isMet?' success':' neutral'}`} style={{marginBottom:'1rem'}}>
          Good output: <b>{good} units</b>
          {isBelow&&<span> — short by {pj.target-good}</span>}
          {isMet&&<span> — target met ✓</span>}
          <div style={{marginTop:4,fontSize:10}}>New: {Number(newP)||0} · Rework: {Number(reworkP)||0} · Casting defect: {Number(castDef)||0} · Machining defect: {Number(machDef)||0}</div>
          <div style={{marginTop:2,fontSize:10,color:'var(--text2)'}}>Total pulled from stock/WIP: {consumed} {(Number(castDef)||0)+(Number(machDef)||0)>0?'(defects are scrapped, not carried forward)':''}</div>
        </div>
      )}
      {isBelow&&(
        <div className="field">
          <label>Reason for shortfall (required)</label>
          <textarea className="mi" rows={3} style={{resize:'vertical',lineHeight:1.6}} placeholder="e.g. Machine breakdown, material shortage..." value={reason} onChange={e=>setReason(e.target.value)}/>
        </div>
      )}
      {err&&<div className="error-msg">{err}</div>}
      <div className="mi-row" style={{marginTop:'.5rem'}}>
        <button className="add-btn" onClick={submit}>COMPLETE SHIFT →</button>
        <button className="can-btn" onClick={onClose}>Cancel</button>
      </div>
    </Modal>
  );
}

// ── Log Progress Modal ─────────────────────────────────────
function LogProgressModal({machine,pj,onSubmit,onClose}) {
  const [newP,setNewP]=useState(machine.newPieces||0);
  const [reworkP,setReworkP]=useState(machine.reworkPieces||0);
  const [castDef,setCastDef]=useState(machine.castingDefects||0);
  const [machDef,setMachDef]=useState(machine.machiningDefects||0);
  const [err,setErr]=useState('');
  const good=(Number(newP)||0)+(Number(reworkP)||0);
  const consumed=good+(Number(castDef)||0)+(Number(machDef)||0);
  const submit=()=>{
    setErr('');
    if(newP===''||reworkP===''||castDef===''||machDef==='') return setErr('Enter all four counts (use 0 if none).');
    if([newP,reworkP,castDef,machDef].some(v=>Number(v)<0)) return setErr('Counts cannot be negative.');
    onSubmit({newPieces:Number(newP),reworkPieces:Number(reworkP),castingDefects:Number(castDef),machiningDefects:Number(machDef),total:good,consumed});
  };
  return (
    <Modal onClose={onClose} title="Log production">
      <div className="info-box neutral" style={{marginBottom:'1rem'}}>
        <div>{machine.name} · {pj.name}</div>
        <div style={{marginTop:2}}>Target: <b style={{color:'var(--text)'}}>{pj.target} units</b> (this updates your running count — it does not end the shift)</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
        <div className="field" style={{marginBottom:0}}><label>New pieces (so far)</label><input className="mi" type="number" min="0" value={newP} onChange={e=>setNewP(e.target.value)}/></div>
        <div className="field" style={{marginBottom:0}}><label>Rework pieces (so far)</label><input className="mi" type="number" min="0" value={reworkP} onChange={e=>setReworkP(e.target.value)}/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:'1rem'}}>
        <div className="field" style={{marginBottom:0}}><label>Casting defect (so far)</label><input className="mi" type="number" min="0" value={castDef} onChange={e=>setCastDef(e.target.value)}/></div>
        <div className="field" style={{marginBottom:0}}><label>Machining defect (so far)</label><input className="mi" type="number" min="0" value={machDef} onChange={e=>setMachDef(e.target.value)}/></div>
      </div>
      <div className="info-box neutral" style={{marginBottom:'1rem'}}>Good output: <b style={{color:'var(--text)'}}>{good} / {pj.target}</b> &nbsp;·&nbsp; Total pulled: {consumed}</div>
      {err&&<div className="error-msg">{err}</div>}
      <div className="mi-row" style={{marginTop:'.5rem'}}>
        <button className="add-btn" style={{background:'var(--accent)'}} onClick={submit}>SAVE PROGRESS</button>
