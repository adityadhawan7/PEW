// ── Download Report Modal ──────────────────────────────────
function DownloadModal({alerts,onClose}) {
  const [from,setFrom]=useState(todayStr());
  const [to,setTo]=useState(todayStr());
  const [groupBy,setGroupBy]=useState('all_machines');
  const [filterCat,setFilterCat]=useState('all');
  const [filterVal,setFilterVal]=useState('');

  const machineIds=[...new Set(alerts.filter(a=>a.data&&a.data.machine).map(a=>a.data.machine))].sort();
  const operatorNames=[...new Set(alerts.filter(a=>a.data&&a.data.operator).map(a=>a.data.operator))].sort();

  const baseFiltered=alerts.filter(a=>{
    const d=a.date||todayStr();
    if(d<from||d>to) return false;
    if(filterCat==='production') return a.data&&(a.data.category==='production'||a.data.category==='shortfall');
    if(filterCat==='shortfall') return a.type==='shortfall'||(a.data&&a.data.category==='shortfall');
    if(filterCat==='breakdown') return a.type==='danger'||(a.data&&a.data.category==='breakdown');
    return true;
  });

  const filtered=baseFiltered.filter(a=>{
    if(!filterVal) return true;
    if(groupBy==='per_machine') return a.data&&a.data.machine===filterVal;
    if(groupBy==='per_operator') return a.data&&a.data.operator===filterVal;
    return true;
  });

  const buildRows=()=>{
    const header=['Date','Time','Category','Machine','Operator','Job','Total Produced','New Pieces','Rework Pieces','Target','Shortfall','Reason','Decision','Decision Note','Decided By'];
    const rows=[header];
    filtered.forEach(a=>{
      if(!a.data) return;
      const cat=a.data.category||(a.type==='shortfall'?'shortfall':a.type==='danger'?'breakdown':'alert');
      rows.push([a.date||'',a.time||'',cat.charAt(0).toUpperCase()+cat.slice(1),a.data.machine||'',a.data.operator||'',a.data.job||'',a.data.produced??'',a.data.newPieces??'',a.data.reworkPieces??'',a.data.target??'',a.data.shortfall||'',a.data.reason||'',a.data.status&&a.data.status!=='pending'?a.data.status:'',a.data.decisionNote||'',a.data.decidedBy||'']);
    });
    return rows;
  };

  const buildSummary=()=>{
    const groups={};
    filtered.forEach(a=>{
      if(!a.data) return;
      const key=groupBy==='per_operator'?(a.data.operator||'Unknown'):(a.data.machine||'Unknown');
      if(!groups[key]) groups[key]={key,production:0,totalProduced:0,newPieces:0,reworkPieces:0,shortfalls:0,breakdowns:0,shortfallUnits:0};
      const g=groups[key];
      const cat=a.data.category||(a.type==='shortfall'?'shortfall':a.type==='danger'?'breakdown':'');
      if(cat==='production'||cat==='shortfall'){g.production++;g.totalProduced+=Number(a.data.produced)||0;g.newPieces+=Number(a.data.newPieces)||0;g.reworkPieces+=Number(a.data.reworkPieces)||0;}
      if(cat==='shortfall'){g.shortfalls++;g.shortfallUnits+=Number(a.data.shortfall)||0;}
      if(cat==='breakdown') g.breakdowns++;
    });
    const label=groupBy==='per_operator'?'Operator':'Machine';
    const header=[label,'Shifts Completed','Total Produced','New Pieces','Rework Pieces','Shortfall Shifts','Shortfall Units','Breakdowns'];
    const rows=[header];
    Object.values(groups).sort((a,b)=>a.key.localeCompare(b.key)).forEach(g=>{
      rows.push([g.key,g.production,g.totalProduced,g.newPieces,g.reworkPieces,g.shortfalls,g.shortfallUnits,g.breakdowns]);
    });
    return rows;
  };

  const toCSV=rows=>rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');

  const downloadCSV=()=>{
    const csv='SUMMARY\n'+toCSV(buildSummary())+'\n\nDETAIL\n'+toCSV(buildRows());
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const el=document.createElement('a');
    el.href=url; el.download=`factoryos-report-${from}-to-${to}.csv`; el.click(); URL.revokeObjectURL(url);
  };

  const downloadPDF=()=>{
    const detail=buildRows();
    const summary=buildSummary();
    const groupLabel={'all_machines':'All Machines','all_operators':'All Operators','per_machine':'Per Machine','per_operator':'Per Operator'}[groupBy];
    const catLabel={'all':'All','production':'Production','shortfall':'Shortfalls','breakdown':'Breakdowns'}[filterCat];
    const thS='background:#1f2330;color:#dde2ef;padding:6px 8px;text-align:left;border:1px solid #2e3445;font-family:monospace;font-size:10px';
    const tdS='padding:5px 8px;border:1px solid #2e3445;color:#dde2ef;vertical-align:top;font-size:11px';
    const makeTable=(rows,title)=>{
      if(rows.length<=1) return `<h3 style="font-family:monospace;font-size:11px;text-transform:uppercase;color:#7d849a;margin:0 0 8px">${title}</h3><p style="color:#7d849a;font-size:12px">No data</p>`;
      const [hdr,...data]=rows;
      return `<h3 style="font-family:monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7d849a;margin:0 0 8px">${title}</h3>
      <table style="border-collapse:collapse;width:100%;margin-bottom:28px">
        <thead><tr>${hdr.map(h=>`<th style="${thS}">${h}</th>`).join('')}</tr></thead>
        <tbody>${data.map((r,i)=>`<tr style="background:${i%2===0?'#111318':'#181b23'}">${r.map(v=>`<td style="${tdS}">${v??''}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>`;
    };
    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>FactoryOS Report</title>
    <style>@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>
    </head><body style="background:#0c0e13;color:#dde2ef;font-family:Barlow,sans-serif;padding:32px;margin:0">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <div style="width:8px;height:8px;border-radius:50%;background:#00c8f0"></div>
        <span style="font-family:monospace;font-size:12px;letter-spacing:.15em;color:#00c8f0">FACTORY OS — PRODUCTION REPORT</span>
      </div>
      <div style="font-size:11px;color:#7d849a;margin-bottom:4px;font-family:monospace">Period: ${from} to ${to}</div>
      <div style="font-size:11px;color:#7d849a;margin-bottom:28px;font-family:monospace">Group: ${groupLabel} · Category: ${catLabel}${filterVal?' · Filter: '+filterVal:''} · ${filtered.length} records</div>
      ${makeTable(summary,'Summary')}
      ${makeTable(detail,'Detail log')}
    </body></html>`;
    const w=window.open('','_blank');
    if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);}
  };

  const showFilter=groupBy==='per_machine'||groupBy==='per_operator';
  const filterOptions=groupBy==='per_machine'?machineIds:operatorNames;

  return (
    <Modal onClose={onClose} title="Download report" wide>
      <p className="modal-note">Select a date range, grouping, and category. Download as CSV (Excel/Sheets) or PDF.</p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:'1rem'}}>
        <div className="field" style={{marginBottom:0}}><label>From</label><input type="date" className="mi" value={from} onChange={e=>setFrom(e.target.value)}/></div>
        <div className="field" style={{marginBottom:0}}><label>To</label><input type="date" className="mi" value={to} onChange={e=>setTo(e.target.value)}/></div>
      </div>
      <div className="field">
        <label>Group by</label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
          {[['all_machines','All Machines'],['all_operators','All Operators'],['per_machine','Per Machine'],['per_operator','Per Operator']].map(([v,l])=>(
            <div key={v} className={`role-chip${groupBy===v?' active':''}`} onClick={()=>{setGroupBy(v);setFilterVal('');}}>{l}</div>
          ))}
        </div>
      </div>
      {showFilter&&(
        <div className="field">
          <label>{groupBy==='per_machine'?'Select machine':'Select operator'}</label>
          <select className="mi" value={filterVal} onChange={e=>setFilterVal(e.target.value)}>
            <option value="">— All —</option>
            {filterOptions.map(v=><option key={v} value={v}>{v}</option>)}
          </select>
        </div>
      )}
      <div className="field">
        <label>Category</label>
        <div className="role-chips">
          {[['all','All'],['production','Production'],['shortfall','Shortfalls'],['breakdown','Breakdowns']].map(([v,l])=>(
            <div key={v} className={`role-chip${filterCat===v?' active':''}`} onClick={()=>setFilterCat(v)}>{l}</div>
          ))}
        </div>
      </div>
      <div className="info-box neutral" style={{marginBottom:'1rem'}}>{filtered.length} record{filtered.length!==1?'s':''} found</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <button className="add-btn" style={{background:'var(--accent3)',color:'#000',opacity:filtered.length?1:0.4,padding:'10px'}} onClick={()=>{if(filtered.length)downloadCSV();}}>↓ EXCEL / CSV</button>
        <button className="add-btn" style={{background:'var(--accent)',color:'#000',opacity:filtered.length?1:0.4,padding:'10px'}} onClick={()=>{if(filtered.length)downloadPDF();}}>↓ PDF</button>
      </div>
    </Modal>
  );
}

// ── Breakdown History Card ───────────────────────────────────
function BreakdownHistoryModal({alerts,machines,onClose}) {
  const [selM,setSelM]=useState('all');
  const uniqueMachines=Object.values(machines.reduce((acc,m)=>{ if(!acc[m.id]) acc[m.id]={id:m.id,name:m.name}; return acc; },{}));

  const rowsForMachine=machineName=>{
    const bds=alerts.filter(a=>a.data&&a.data.category==='breakdown'&&a.data.machine===machineName).slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    const rps=alerts.filter(a=>a.data&&a.data.category==='repair'&&a.data.machine===machineName).slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    const used=new Set();
    return bds.map((bd,i)=>{
      let matched=null;
      for(let j=0;j<rps.length;j++){
        if(used.has(j)) continue;
        if(new Date(rps[j].ts)>=new Date(bd.ts)){ matched=rps[j]; used.add(j); break; }
      }
      const hours=matched?((new Date(matched.ts)-new Date(bd.ts))/3600000):null;
      return {
        sr:i+1, date:bd.date, nature:bd.data.reason||'',
        action:matched?matched.data.reason:'', from:bd.time, to:matched?matched.time:'',
        hours:hours!==null?hours.toFixed(1):'', remarks:matched?'':'Breakdown ongoing'
      };
    });
  };

  const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const buildCard=(machineName,machineId,rows,pageIdx,totalPages)=>{
    const MIN_ROWS=7;
    const dataRows=rows.map(r=>`
      <tr>
        <td style="text-align:center">${r.sr}</td>
        <td style="text-align:center">${esc(r.date)}</td>
        <td>${esc(r.nature)}</td>
        <td>${esc(r.action)}</td>
        <td style="text-align:center">${esc(r.from)}</td>
        <td style="text-align:center">${esc(r.to)}</td>
        <td style="text-align:center">${esc(r.hours)}</td>
        <td>${esc(r.remarks)}</td>
      </tr>`).join('');
    const blankCount=Math.max(0,MIN_ROWS-rows.length);
    const blankRows=Array.from({length:blankCount}).map(()=>`<tr>${Array.from({length:8}).map(()=>'<td>&nbsp;</td>').join('')}</tr>`).join('');
    return `
    <div class="card">
      <table class="hdr">
        <tr>
          <td class="logo" rowspan="6">P<span>E</span>W</td>
          <td class="company" rowspan="3">PUNJAB ENGINEERING WORKS<br/><span class="sub">(JAIPUR SOUTH)</span></td>
          <td class="dk">Doc. No.</td><td class="dv">PEW/MNT/F04</td>
        </tr>
        <tr><td class="dk">Page No.</td><td class="dv">Page ${pageIdx} of ${totalPages}</td></tr>
        <tr><td class="dk">Issue No.</td><td class="dv">01</td></tr>
        <tr>
          <td class="title" rowspan="3">Machine Breakdown Record<br/><span class="sub">(History Card)</span></td>
          <td class="dk">Issue Date</td><td class="dv">Apr. 01, 2021</td>
        </tr>
        <tr><td class="dk">Rev. No.</td><td class="dv">00</td></tr>
        <tr><td class="dk">Rev. Date</td><td class="dv">----</td></tr>
      </table>
      <div class="mline"><span>Name of Machine: <b>${esc(machineName)}</b></span><span>Identification No.: <b>${esc(machineId)}</b></span></div>
      <table class="main">
        <thead>
          <tr>
            <th rowspan="2" style="width:34px">S.<br/>No.</th>
            <th rowspan="2" style="width:80px">Date</th>
            <th rowspan="2">Nature of Breakdown</th>
            <th rowspan="2">Action taken</th>
            <th colspan="2">Breakdown time</th>
            <th rowspan="2" style="width:70px">Total Breakdown Hours</th>
            <th rowspan="2" style="width:90px">Remarks</th>
          </tr>
          <tr><th style="width:50px">From</th><th style="width:50px">To</th></tr>
        </thead>
        <tbody>${dataRows}${blankRows}</tbody>
      </table>
    </div>`;
  };

  const download=()=>{
    const targets=selM==='all'?uniqueMachines:uniqueMachines.filter(m=>m.id===selM);
    if(!targets.length) return;
    const cards=targets.map((m,i)=>buildCard(m.name,m.id,rowsForMachine(m.name),i+1,targets.length)).join('');
    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Breakdown History Card</title>
    <style>
      *{box-sizing:border-box}
      body{font-family:Arial,Helvetica,sans-serif;color:#000;margin:0;padding:24px;background:#fff}
      .card{border:5px solid #1565c0;padding:10px;max-width:1000px;margin:0 auto 24px;page-break-after:always}
      .card:last-child{page-break-after:auto}
      table.hdr{width:100%;border-collapse:collapse;margin-bottom:14px}
      table.hdr td{border:1px solid #000;padding:4px 8px;font-size:12px;vertical-align:middle}
      .logo{width:90px;text-align:center;font-size:26px;font-weight:bold;color:#1565c0;font-family:'Arial Black',sans-serif;letter-spacing:2px}
      .logo span{color:#000}

// ── Wage Register Modal ────────────────────────────────────
function WageRegisterModal({users,attendance,alerts,onClose}) {
  const [from,setFrom]=useState(todayStr());
  const [to,setTo]=useState(todayStr());
  const operators=users.filter(u=>u.role==='operator');

  const dateRange=()=>{
    const out=[];
    let d=new Date(from+'T00:00:00');
    const end=new Date(to+'T00:00:00');
    while(d<=end){ out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); d.setDate(d.getDate()+1); }
    return out;
  };
  const days=dateRange();

  // OT pay comes from production alerts logged at shift-complete (category 'production' or 'shortfall'),
  // which already carry otPay/otHours computed at the moment the shift was completed.
  const otByOperatorDate={};
  alerts.forEach(a=>{
    if(!a.data||!(a.data.category==='production'||a.data.category==='shortfall')) return;
    if(a.data.otPay===undefined||!a.data.operator) return;
    const key=a.data.operator+'|'+(a.date||'');
    otByOperatorDate[key]=(otByOperatorDate[key]||0)+(a.data.otPay||0);
  });

  const rows=operators.map(o=>{
    let presentDays=0,halfDays=0,absentDays=0,basePay=0,otPay=0;
    days.forEach(d=>{
      const status=(attendance[d]||{})[o.username];
      if(status==='present'){presentDays++;basePay+=o.dailyWage||0;}
      else if(status==='half'){halfDays++;basePay+=(o.dailyWage||0)/2;}
      else if(status==='absent'){absentDays++;}
      const key=o.name+'|'+d;
      otPay+=otByOperatorDate[key]||0;
    });
    return {username:o.username,name:o.name,dailyWage:o.dailyWage||0,presentDays,halfDays,absentDays,basePay:Math.round(basePay*100)/100,otPay:Math.round(otPay*100)/100,total:Math.round((basePay+otPay)*100)/100};
  });

  const grandTotal=rows.reduce((s,r)=>s+r.total,0);

  const toCSV=()=>{
    const header=['Operator','Daily Wage','Present Days','Half Days','Absent Days','Base Pay','OT Pay','Total Pay'];
    const body=rows.map(r=>[r.name,r.dailyWage,r.presentDays,r.halfDays,r.absentDays,r.basePay,r.otPay,r.total]);
    const all=[header,...body,[],['','','','','','','Grand total',Math.round(grandTotal*100)/100]];
    const csv=all.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const el=document.createElement('a');
    el.href=url; el.download=`wage-register-${from}-to-${to}.csv`; el.click(); URL.revokeObjectURL(url);
  };

  return (
    <Modal onClose={onClose} title="Wage register" wide>
      <p className="modal-note">Base pay comes from attendance × daily wage. Overtime pay is auto-calculated whenever a completed shift exceeds its target: extra units ÷ units-per-hour rate = OT hours, paid at the operator's plain hourly rate (daily wage ÷ 8).</p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:'1rem'}}>
        <div className="field" style={{marginBottom:0}}><label>From</label><input type="date" className="mi" value={from} onChange={e=>setFrom(e.target.value)}/></div>
        <div className="field" style={{marginBottom:0}}><label>To</label><input type="date" className="mi" value={to} onChange={e=>setTo(e.target.value)}/></div>
      </div>
      {!operators.length?<div className="empty">No operator accounts yet</div>:(
        <div className="pj-list">
          {rows.map(r=>(
            <div className="pj-row" key={r.username} style={{alignItems:'flex-start'}}>
              <div className="pj-info">
                <div className="pj-name">{r.name}</div>
                <div className="pj-meta">{r.presentDays}P · {r.halfDays}H · {r.absentDays}A &nbsp;·&nbsp; base ₹{r.basePay} + OT ₹{r.otPay}</div>
              </div>
              <div className="pj-target" style={{fontSize:13}}>₹{r.total}</div>
            </div>
          ))}
        </div>
      )}
      <div className="info-box success" style={{marginTop:'1rem',marginBottom:'1rem'}}>Grand total: <b>₹{Math.round(grandTotal*100)/100}</b> across {rows.length} operator{rows.length!==1?'s':''}, {days.length} day{days.length!==1?'s':''}</div>
      <button className="add-btn" style={{background:'var(--accent3)',color:'#000'}} onClick={toCSV}>↓ DOWNLOAD WAGE REGISTER (CSV)</button>
    </Modal>
  );
}

  const sid=useRef('sess_'+Math.random().toString(36).slice(2)+Date.now().toString(36));
  const isAdmin=currentUser.role==='admin'||currentUser.role==='supervisor';

  useEffect(()=>{
    Promise.all([
      fb.get('machines').then(v=>v||initMachines()),
      fb.get('alerts').then(v=>v||[]),
      fb.get('casting_types').then(v=>normalizeCastingTypes(v||DEFAULT_CASTING_TYPES)),
      fb.get('wip').then(v=>v||{}),
      fb.get('stock_log').then(v=>v||[]),
      fb.get('attendance').then(v=>v||{}),
    ]).then(([m,a,ct,w,sl,at])=>{
      setMachines(m); setAlerts(a); setCastingTypes(ct); setWip(w); setStockLog(sl); setAttendance(at); setMachinesLoaded(true);
    });
    const unM=fb.sub('machines',v=>{if(v)setMachines(v);});
    const unA=fb.sub('alerts',v=>{if(v)setAlerts(v);});
    const unCt=fb.sub('casting_types',v=>{if(v)setCastingTypes(normalizeCastingTypes(v));});
    const unW=fb.sub('wip',v=>{if(v)setWip(v);});
    const unSL=fb.sub('stock_log',v=>{if(v)setStockLog(v);});
    const unAt=fb.sub('attendance',v=>{if(v)setAttendance(v);});
    const unS=fb.sub('sessions',v=>{if(v)setSessions(v);});
    return()=>{unM();unA();unCt();unW();unSL();unAt();unS();};
  },[]);

  useEffect(()=>{
    if(!machinesLoaded) return;
    const t=setTimeout(()=>fb.set('machines',machines),600);
    return()=>clearTimeout(t);
  },[machines,machinesLoaded]);

  useEffect(()=>{
    const info={username:currentUser.username,name:currentUser.name,role:currentUser.role,shift:viewShift};
    const beat=async()=>{
      const s=await fb.get('sessions').then(v=>v||{});
      const now=Date.now();
      Object.keys(s).forEach(id=>{if(now-s[id].lastSeen>120000)delete s[id];});
      s[sid.current]={...info,lastSeen:now};
      await fb.set('sessions',s);
    };
    beat();
    const t=setInterval(beat,30000);
    return()=>{
      clearInterval(t);
      fb.get('sessions').then(s=>{if(s){delete s[sid.current];fb.set('sessions',s);}});
    };
  },[currentUser,viewShift]);

  useEffect(()=>{const t=setInterval(()=>setClock(new Date()),1000);return()=>clearInterval(t);},[]);

  useEffect(()=>{
    if(!machinesLoaded) return;
    const t=setInterval(()=>{
      setMachines(prev=>prev.map(m=>{
        if(m.shift==='cnc_vmc'){
          if(!m.shifts) return m;
          const bump=slot=>(slot&&slot.status==='running')?{...slot,progress:Math.min(100,slot.progress+rnd(0,2)),output:Math.min(m.target,slot.output+rnd(0,2))}:slot;
          return {...m,shifts:{day:bump(m.shifts.day),night:bump(m.shifts.night)}};
        }
        if(m.status!=='running') return m;
        return {...m,progress:Math.min(100,m.progress+rnd(0,2)),output:Math.min(m.target,m.output+rnd(0,2))};
      }));
    },3500);
    return()=>clearInterval(t);
  },[machinesLoaded]);

  const writeAlerts=newAlerts=>{ setAlerts(newAlerts); fb.set('alerts',newAlerts); };
  const pushAlert=(type,msg,data=null)=>{ const a={id:Date.now(),type,msg,data,time:nowStr(),date:todayStr(),ts:fullTs()}; writeAlerts([a,...alerts].slice(0,200)); };
  const removeAlert=id=>writeAlerts(alerts.filter(x=>x.id!==id));
  const clearAllAlerts=()=>writeAlerts([]);

  const setIdle=(id,shiftKey)=>{
    const updated=patchMachineShift(machines,id,shiftKey,{status:'idle',job:null,progress:0});
    setMachines(updated); fb.set('machines',updated);
  };

  const handleRepairSubmit=assessment=>{
    if(!repairData) return;
    const {machine:m,shiftKey}=repairData;
    const updated=patchMachineShift(machines,m.id,shiftKey,{status:'idle',progress:0});
    setMachines(updated); fb.set('machines',updated);
    const a={id:Date.now(),type:'info',msg:`✓ ${m.name} (${shiftKey} shift) marked repaired by ${currentUser.name} — ${assessment}`,data:{machine:m.name,machineId:m.id,shiftKey,operator:m.operator,reason:assessment,category:'repair',decidedBy:currentUser.name},time:nowStr(),date:todayStr(),ts:fullTs()};
    writeAlerts([a,...alerts].slice(0,200));
    setRepairData(null);
  };

  const handleBreakdownSubmit=reason=>{
    if(!breakdownData) return;
    const {machine:m,shiftKey}=breakdownData;
    const updated=patchMachineShift(machines,m.id,shiftKey,{status:'breakdown'});
    setMachines(updated); fb.set('machines',updated);
    const a={id:Date.now(),type:'danger',msg:`⚠ ${m.name} breakdown — ${reason}`,data:{machine:m.name,machineId:m.id,shiftKey,operator:m.operator,reason,category:'breakdown'},time:nowStr(),date:todayStr(),ts:fullTs()};
    writeAlerts([a,...alerts].slice(0,200));
    setBreakdownData(null);
  };

  const handleLogProgress=({newPieces,reworkPieces,castingDefects,machiningDefects,total})=>{
    if(!logProgressData) return;
    const {machine:m,shiftKey}=logProgressData;
    const updated=patchMachineShift(machines,m.id,shiftKey,{prodCount:total,newPieces,reworkPieces,castingDefects,machiningDefects});
    setMachines(updated); fb.set('machines',updated);
    setLogProgressData(null);
  };

  const handleSubmitSettingInspection=rows=>{
    if(!lineInspectionData) return;
    const {machine:m,shiftKey}=lineInspectionData;
    const updated=patchMachineShift(machines,m.id,shiftKey,{lineInspection:rows,settingApprovalStatus:'pending',settingRejectionNote:null});
    setMachines(updated); fb.set('machines',updated);
    const a={id:Date.now(),type:'setting_review',msg:null,data:{machine:m.name,operator:m.operator,machineId:m.id,shiftKey,rows,category:'setting_review',status:'pending'},time:nowStr(),date:todayStr(),ts:fullTs()};
    writeAlerts([a,...alerts].slice(0,200));
    setLineInspectionData(null);
  };

  const handleSettingDecision=note=>{
    if(!settingDecisionData) return;
    const {alertId,decision}=settingDecisionData;
    const alert=alerts.find(x=>x.id===alertId);
    if(!alert||!alert.data) return;
    const {machineId,shiftKey}=alert.data;
    const updated=patchMachineShift(machines,machineId,shiftKey,{
      settingApproved:decision==='approved',
      settingApprovalStatus:decision,
      settingRejectionNote:decision==='disapproved'?note:null
    });
    setMachines(updated); fb.set('machines',updated);
    const newAlerts=alerts.map(a=>a.id===alertId&&a.data?{...a,data:{...a.data,status:decision,decisionNote:note,decidedBy:currentUser.name}}:a);
    setAlerts(newAlerts); fb.set('alerts',newAlerts);
    setSettingDecisionData(null);
  };

  const handleShiftComplete=({newPieces,reworkPieces,castingDefects,machiningDefects,total,consumed,reason})=>{
    if(!shiftCompleteData) return;
    const {machine:m,pj,shiftKey}=shiftCompleteData;
    const isBelow=total<pj.target;
    const updated=patchMachineShift(machines,m.id,shiftKey,{shiftComplete:true,prodCount:total,newPieces,reworkPieces,castingDefects,machiningDefects});
    setMachines(updated); fb.set('machines',updated);

    const ct=castingTypes.find(c=>Number(c.id)===Number(m.castingTypeId));
    const route=ct&&m.routeId?ct.routes.find(r=>Number(r.routeId)===Number(m.routeId)):null;
    const nodeId=m.nodeId;
    if(ct&&route&&nodeId){
      const logEntries=[];
      let updatedTypes=castingTypes;
      let updatedWip={...wip};

      // Coerce to number everywhere — Firebase JSON round-trips can turn numeric nodeIds in
      // nested arrays into strings, causing strict-equality comparisons to silently fail.
      const nodeIdN=Number(nodeId);
      const stepIdx=route.steps.findIndex(s=>
        s.type==='fixed'?Number(s.nodeId)===nodeIdN:s.nodeIds.map(Number).includes(nodeIdN)
      );
      if(stepIdx===-1){
        // Couldn't match this node to any step in the route — data mismatch, bail out safely
        // rather than silently writing garbage WIP values.
        console.warn('handleShiftComplete: nodeId',nodeIdN,'not found in route steps',route.steps);
        writeAlerts([{id:Date.now(),type:'warn',msg:`⚠ ${m.name}: shift marked complete but WIP could not be updated — route step mismatch. Check Casting types.`,time:nowStr(),date:todayStr(),ts:fullTs()},...alerts].slice(0,200));
        setShiftCompleteData(null);
        return;
      }
      const step=route.steps[stepIdx];
      const isFirstStep=stepIdx===0;
      const isLastStep=stepIdx===route.steps.length-1;
      const node=ct.nodes.find(n=>Number(n.nodeId)===nodeIdN);
      const nodeLabel=node?node.name:`node ${nodeIdN}`;
      const gateKeyFor=floatStep=>`gate:${floatStep.nodeIds[0]}`;
      const floatDoneKeyFor=(floatStep,nid)=>`floatdone:${floatStep.nodeIds[0]}:${nid}`;

      // INPUT: pull consumed pieces from wherever this step's work comes from.
      if(isFirstStep){
        updatedTypes=updatedTypes.map(c=>c.id===ct.id?{...c,rawBalance:Math.round((c.rawBalance-consumed)*100)/100}:c);
      } else if(step.type==='fixed'){
        const key=wipKey(ct.id,nodeId);
        updatedWip[key]=Math.max(0,Math.round(((updatedWip[key]||0)-consumed)*100)/100);
      } else {
        // Floating step: every node in the group draws from the SAME shared gate pool — it is not
        // decremented per node, since the same batch of pieces is available to whichever floating
        // operation picks it up. What's tracked separately is each node's own completed count.
        const gateKey=wipKey(ct.id,gateKeyFor(step));
        const doneKey=wipKey(ct.id,floatDoneKeyFor(step,nodeId));
        updatedWip[doneKey]=Math.round(((updatedWip[doneKey]||0)+consumed)*100)/100;
        // Gate pool itself only shrinks once EVERY node in the group has cleared a piece, since that's
        // the point a piece is no longer "available" to any floating operation — handled below.
      }
      logEntries.push({id:Date.now()+1,type:'out',itemId:ct.id,itemName:ct.name,unit:ct.unit,qty:consumed,machine:m.name,stageLabel:`${route.name} · ${nodeLabel}`,note:`${total} good (${newPieces} new, ${reworkPieces} rework)`,date:todayStr(),time:nowStr(),ts:fullTs()});

      // OUTPUT: good pieces (new + rework) move forward.
      if(isLastStep){
        // Nothing further — this output is finished. (No WIP write needed.)
      } else if(step.type==='fixed'){
        const nextStep=route.steps[stepIdx+1];
        const nextKey=nextStep.type==='fixed'?wipKey(ct.id,nextStep.nodeId):wipKey(ct.id,gateKeyFor(nextStep));
        if(total>0) updatedWip[nextKey]=Math.round(((updatedWip[nextKey]||0)+total)*100)/100;
      } else {
        // Completing a floating node doesn't immediately push pieces forward — a piece only moves on
        // once EVERY node in this floating group has processed it. Recompute the group's completed
        // count as the minimum across all its nodes; any newly-cleared amount (beyond what was already
        // released) advances to the next step and is removed from the gate pool.
        const groupNodeIds=step.nodeIds;
        const gateKey=wipKey(ct.id,gateKeyFor(step));
        const doneCounts=groupNodeIds.map(nid=>updatedWip[wipKey(ct.id,floatDoneKeyFor(step,nid))]||0);
        const minDone=Math.min(...doneCounts);
        const releasedKey=wipKey(ct.id,`floatreleased:${gateKeyFor(step)}`);
        const alreadyReleased=updatedWip[releasedKey]||0;
        const newlyReleased=Math.max(0,Math.round((minDone-alreadyReleased)*100)/100);
        if(newlyReleased>0){
          updatedWip[releasedKey]=minDone;
          updatedWip[gateKey]=Math.max(0,Math.round(((updatedWip[gateKey]||0)-newlyReleased)*100)/100);
          if(!isLastStep){
            const nextStep=route.steps[stepIdx+1];
            const nextKey=nextStep.type==='fixed'?wipKey(ct.id,nextStep.nodeId):wipKey(ct.id,gateKeyFor(nextStep));
            updatedWip[nextKey]=Math.round(((updatedWip[nextKey]||0)+newlyReleased)*100)/100;
          }
        }
      }

      // Defects are scrapped — logged for records, removed from the system, do not proceed.
      const defectTotal=castingDefects+machiningDefects;
      if(defectTotal>0){
        if(castingDefects>0) logEntries.push({id:Date.now()+2,type:'defect',itemId:ct.id,itemName:ct.name,unit:ct.unit,qty:castingDefects,machine:m.name,stageLabel:`${route.name} · ${nodeLabel} · Casting defect`,note:'Scrapped — foundry fault',date:todayStr(),time:nowStr(),ts:fullTs()});
        if(machiningDefects>0) logEntries.push({id:Date.now()+3,type:'defect',itemId:ct.id,itemName:ct.name,unit:ct.unit,qty:machiningDefects,machine:m.name,stageLabel:`${route.name} · ${nodeLabel} · Machining defect`,note:'Scrapped — machining fault',date:todayStr(),time:nowStr(),ts:fullTs()});
      }

      setCastingTypes(updatedTypes); fb.set('casting_types',updatedTypes);
      setWip(updatedWip); fb.set('wip',updatedWip);
      const updatedLog=[...logEntries,...stockLog].slice(0,500);
      setStockLog(updatedLog); fb.set('stock_log',updatedLog);
    }

    // OT pay: extra units above target, converted to hours via the stage's units/hour rate,
    // paid at the operator's plain hourly rate (dailyWage/8). Only counted once shift is complete.
    const opUser=users.find(u=>u.username===m.assignedOperator)||users.find(u=>u.name===m.operator);
    const {otHours,otPay}=calcOtPay(total,pj.target,pj.ratePerHour,opUser?opUser.dailyWage:0);

    const a={
      id:Date.now(),
      type:isBelow?'shortfall':'info',
      msg:isBelow?null:`✓ ${m.name} (${shiftKey} shift): "${pj.name}" — ${total} units (${newPieces} new, ${reworkPieces} rework)${(castingDefects+machiningDefects)>0?` · ${castingDefects+machiningDefects} defects`:''}${otPay?` · OT ₹${otPay}`:''}`,
      time:nowStr(),date:todayStr(),ts:fullTs(),
      data:{machine:m.name,operator:m.operator,job:pj.name,produced:total,newPieces,reworkPieces,castingDefects,machiningDefects,target:pj.target,shortfall:isBelow?pj.target-total:0,reason:reason||null,status:isBelow?'pending':null,category:isBelow?'shortfall':'production',otHours,otPay}
    };
    writeAlerts([a,...alerts].slice(0,200));
    setShiftCompleteData(null);
  };


  const handleDecisionSubmit=note=>{
    if(!decisionData) return;
    const {alertId,decision}=decisionData;
    const newAlerts=alerts.map(a=>a.id===alertId&&a.data?{...a,data:{...a.data,status:decision,decisionNote:note,decidedBy:currentUser.name}}:a);
    setAlerts(newAlerts);
    fb.set('alerts',newAlerts);
    setDecisionData(null);
  };

  const visible=machines.filter(m=>m.shift===SHIFT_CFG[viewShift].shiftKey).map(m=>withShift(m,viewShift));
  const filtered=filterMode==='all'?visible:visible.filter(m=>m.status===filterMode);
  const running=visible.filter(m=>m.status==='running');
  const maxTarget=Math.max(...running.map(m=>m.target),1);
  const stats={
    run:visible.filter(m=>m.status==='running').length,
    idle:visible.filter(m=>m.status==='idle').length,
    down:visible.filter(m=>m.status==='breakdown').length,
    eff:visible.length?Math.round(visible.reduce((s,m)=>s+(m.output/m.target*100),0)/visible.length):0
  };
  const cfg=SHIFT_CFG[viewShift];
  const rawSelectedM=machines.find(x=>x.id===selectedMachine);
  const selectedM=rawSelectedM?withShift(rawSelectedM,viewShift):null;
  const overviewCounts={day:5,night:5,manual:machines.filter(m=>m.shift==='manual').length};

  if(!machinesLoaded) return <div className="loading-spin">Loading FactoryOS…<div className="loading-hint">Connecting to Firebase. If this takes more than a few seconds, ensure Firestore rules allow read/write.</div></div>;

  return (
    <div className="dashboard">
      {showUser&&<UserModal users={users} setUsers={setUsers} currentUser={currentUser} onClose={()=>setShowUser(false)}/>}
      {showProd&&<CastingTypesModal castingTypes={castingTypes} setCastingTypes={setCastingTypes} onClose={()=>setShowProd(false)}/>}
      {showAssign&&<AssignModal machines={machines} setMachines={setMachines} users={users} castingTypes={castingTypes} wip={wip} onClose={()=>setShowAssign(false)}/>}
      {showOnline&&<OnlineModal sessions={sessions} sid={sid.current} onClose={()=>setShowOnline(false)}/>}
      {showDownload&&<DownloadModal alerts={alerts} onClose={()=>setShowDownload(false)}/>}
      {showBreakdownHistory&&<BreakdownHistoryModal alerts={alerts} machines={machines} onClose={()=>setShowBreakdownHistory(false)}/>}
      {showStock&&<StockModal castingTypes={castingTypes} setCastingTypes={setCastingTypes} wip={wip} setWip={setWip} stockLog={stockLog} setStockLog={setStockLog} onClose={()=>setShowStock(false)}/>}
      {showAttendance&&<AttendanceModal users={users} attendance={attendance} setAttendance={setAttendance} onClose={()=>setShowAttendance(false)}/>}
      {showWageRegister&&<WageRegisterModal users={users} attendance={attendance} alerts={alerts} onClose={()=>setShowWageRegister(false)}/>}
      {shiftCompleteData&&<ShiftCompleteModal machine={shiftCompleteData.machine} pj={shiftCompleteData.pj} onSubmit={handleShiftComplete} onClose={()=>setShiftCompleteData(null)}/>}
      {logProgressData&&<LogProgressModal machine={logProgressData.machine} pj={logProgressData.pj} onSubmit={handleLogProgress} onClose={()=>setLogProgressData(null)}/>}
      {breakdownData&&<BreakdownModal machine={breakdownData.machine} onSubmit={handleBreakdownSubmit} onClose={()=>setBreakdownData(null)}/>}
      {lineInspectionData&&<LineInspectionModal machine={lineInspectionData.machine} onSubmit={handleSubmitSettingInspection} onClose={()=>setLineInspectionData(null)}/>}
      {repairData&&<RepairAssessmentModal machine={repairData.machine} breakdownReason={(alerts.find(a=>a.data&&a.data.category==='breakdown'&&a.data.machine===repairData.machine.name)||{}).data?.reason} onSubmit={handleRepairSubmit} onClose={()=>setRepairData(null)}/>}
      {decisionData&&(()=>{const a=alerts.find(x=>x.id===decisionData.alertId); return a&&a.data?<DecisionModal alertData={a.data} decision={decisionData.decision} onSubmit={handleDecisionSubmit} onClose={()=>setDecisionData(null)}/>:null;})()}
      {settingDecisionData&&(()=>{const a=alerts.find(x=>x.id===settingDecisionData.alertId); return a&&a.data?<SettingDecisionModal alertData={a.data} decision={settingDecisionData.decision} onSubmit={handleSettingDecision} onClose={()=>setSettingDecisionData(null)}/>:null;})()}

      <div className="topbar">
        <div style={{display:'flex',alignItems:'center',gap:'1.25rem',minWidth:0,flexWrap:'wrap'}}>
          <div className="logo-mark"><div className="logo-dot"></div>FACTORY OS · DEV</div>
          <div className="shift-tabs">
            <div className="st-group">
              <button className={`st-tab t-day${viewShift==='day'?' active':''}`} onClick={()=>setViewShift('day')}><div className="dot"></div>CNC/VMC Day</button>
              <button className={`st-tab t-night${viewShift==='night'?' active':''}`} onClick={()=>setViewShift('night')}><div className="dot"></div>CNC/VMC Night</button>
            </div>
            <div className="st-divider"></div>
            <div className="st-group">
              <button className={`st-tab t-manual${viewShift==='manual'?' active':''}`} onClick={()=>setViewShift('manual')}><div className="dot"></div>Manual</button>
            </div>
          </div>
        </div>
        <div className="topbar-right">
          <div className="live-clock">{clock.toLocaleTimeString('en-IN',{hour12:false})}</div>
          <button className="icon-btn" onClick={()=>setShowOnline(true)}>Online</button>
          {isAdmin&&<button className="icon-btn" onClick={()=>setShowDownload(true)}>↓ Report</button>}
          {isAdmin&&<button className="icon-btn" onClick={()=>setShowBreakdownHistory(true)}>⚠ Breakdown history</button>}
          {isAdmin&&<button className="icon-btn" onClick={()=>setShowProd(true)}>Production jobs</button>}
          {isAdmin&&<button className="icon-btn" onClick={()=>setShowAssign(true)}>Assign jobs</button>}
          {isAdmin&&<button className="icon-btn" onClick={()=>setShowStock(true)}>Stock</button>}
          {isAdmin&&<button className="icon-btn" onClick={()=>setShowAttendance(true)}>Attendance</button>}
          {isAdmin&&<button className="icon-btn" onClick={()=>setShowWageRegister(true)}>Wages</button>}
          {currentUser.role==='admin'&&<button className="icon-btn" onClick={()=>setShowUser(true)}>Manage users</button>}
          <div className="user-badge">
            <div className="user-avatar" style={{background:AC[currentUser.role]||'#888'}}>{initials(currentUser.name)}</div>
            <span style={{fontSize:12}}>{currentUser.name} · {currentUser.role}</span>
          </div>
          <button className="icon-btn" onClick={onLogout}>Sign out</button>
        </div>
      </div>

      <div className="shift-banner" style={{borderBottomColor:`${cfg.color}25`}}>
        <div className="sb-dot" style={{background:cfg.color,boxShadow:`0 0 6px ${cfg.color}`}}></div>
        <span style={{fontWeight:500,color:cfg.color}}>{cfg.label}</span>
        <span style={{color:'var(--text2)'}}>{cfg.time}</span>
        <span className="sb-status" style={{color:isActive(viewShift)?'var(--accent3)':'var(--text3)'}}>{isActive(viewShift)?'ACTIVE NOW':'NOT ACTIVE'}</span>
      </div>

      <div className="main-layout">
        <div className="content-area">
          <AssignmentBanner user={currentUser} machines={machines} castingTypes={castingTypes} viewShift={viewShift}/>

          {isAdmin&&castingTypes.some(s=>s.rawBalance<=s.lowThreshold)&&(
            <div className="info-box danger" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
              <span>⚠ Low stock: {castingTypes.filter(s=>s.rawBalance<=s.lowThreshold).map(s=>`${s.name} (${s.rawBalance}${s.unit})`).join(', ')}</span>
              <button className="small-btn" onClick={()=>setShowStock(true)}>View stock</button>
            </div>
          )}

          <div className="stats-row">
            <div className="stat-card s-run"><div className="stat-label">Running</div><div className="stat-val c-green">{stats.run}</div><div className="stat-sub">machines active</div></div>
            <div className="stat-card s-idle"><div className="stat-label">Idle</div><div className="stat-val c-amber">{stats.idle}</div><div className="stat-sub">awaiting jobs</div></div>
            <div className="stat-card s-down"><div className="stat-label">Breakdown</div><div className="stat-val c-red">{stats.down}</div><div className="stat-sub">needs attention</div></div>
            <div className="stat-card s-eff"><div className="stat-label">Efficiency</div><div className="stat-val c-blue">{stats.eff}%</div><div className="stat-sub">output vs target</div></div>
          </div>

          <div>
            <div className="sec-hdr">
              <div className="sec-title">{viewShift==='manual'?'Manual machines & labour stations':'CNC / VMC machine floor'}</div>
              <div className="filter-row">
                {['all','running','idle','breakdown'].map(f=><button key={f} className={`fbtn${filterMode===f?' active':''}`} onClick={()=>setFilterMode(f)}>{f.charAt(0).toUpperCase()+f.slice(1)}</button>)}
              </div>
            </div>
            {!filtered.length?<div className="empty" style={{padding:'2rem'}}>No machines match this filter</div>:(
              <div className="machine-grid">
                {filtered.map(m=>{
                  const {ct,stage,route}=resolveStage(castingTypes,m);
                  const displayJob=ct&&stage?`${ct.name} — ${stage.name}`:m.job||'—';
                  const effectiveTarget=stage?(m.setupApplied&&m.adjustedTarget?m.adjustedTarget:stage.target):null;
                  return (
                    <div key={m.id} className={`m-card ${m.status}${selectedMachine===m.id?' selected':''}`} onClick={()=>setSelectedMachine(selectedMachine===m.id?null:m.id)}>
                      <div className="m-row"><span className="m-id">{m.id}</span><div className="m-dot"></div></div>
                      <div className="m-name">{m.name}</div>
                      <span className="m-badge" style={{background:BADGE[m.type].bg,color:BADGE[m.type].color}}>{BADGE[m.type].lbl}</span>
                      <div className="m-job">{displayJob}</div>
                      {m.assignedOperator&&<div className="m-op">👤 {m.operator}</div>}
                      <div className="m-prog-bg"><div className="m-prog-fill" style={{width:`${m.progress}%`}}></div></div>
                      {stage?(
                        <div className="m-units">{m.prodCount}/{effectiveTarget} units</div>
                      ):(
                        <div className="m-units">No job assigned</div>
                      )}
                      {stage&&m.shiftComplete&&<span className={`shift-done-tag${m.prodCount>=effectiveTarget?' ok':' low'}`}>{m.prodCount}/{effectiveTarget}</span>}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div>
            <div className="sec-hdr"><div className="sec-title">Output vs target — running machines</div></div>
            {!running.length?<div className="empty">No running machines in this shift</div>:(
              <div className="ob-wrap">
                {running.map(m=>{
                  const pct=Math.min(100,Math.round(m.output/m.target*100));
                  const col=pct>=90?'var(--accent3)':pct>=60?'var(--warn)':'var(--danger)';
                  return (
                    <div className="ob-row" key={m.id}>
                      <div className="ob-label">{m.id}</div>
                      <div className="ob-track">
                        <div className="ob-fill" style={{width:`${Math.round(m.output/maxTarget*100)}%`,background:col}}></div>
                        <div className="ob-target" style={{left:`${Math.round(m.target/maxTarget*100)}%`}}></div>
                      </div>
                      <div className="ob-pct">{pct}%</div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div>
            <div className="sec-hdr"><div className="sec-title">All shifts overview</div></div>
            <div className="shift-compare">
              <div className="sc-hdr"><div></div><div>Shift</div><div>Hours</div><div>Machines</div></div>
              {['day','night','manual'].map(s=>(
                <button key={s} className={`sc-row${viewShift===s?' active-view':''}`} onClick={()=>setViewShift(s)}>
                  <div className="sc-dot" style={{background:SHIFT_CFG[s].color}}></div>
                  <div className="sc-name">{SHIFT_CFG[s].label.replace(' Shift','').replace('CNC / VMC — ','CNC/VMC ').replace('Manual / Labour','Manual/Labour')}</div>
                  <div className="sc-time">{SHIFT_CFG[s].time}</div>
                  <div className="sc-count">{overviewCounts[s]} machines</div>
                </button>
              ))}
            </div>
          </div>
        </div>

        <div className="sidebar">
          <div className="sb-sec">
            <div className="sb-title">Machine detail</div>
            {!selectedM?<div className="m-detail"><div className="empty">Select a machine</div></div>:(
              <div className="m-detail">
                <div className="md-hdr">
                  <div className="md-id">{selectedM.id}</div>
                  <span className={`pill${selectedM.status==='running'?' p-run':selectedM.status==='idle'?' p-idle':' p-down'}`}>{selectedM.status.charAt(0).toUpperCase()+selectedM.status.slice(1)}</span>
                </div>
                {(()=>{
                  const {ct:selCt,stage:selStage,route:selRoute}=resolveStage(castingTypes,selectedM);
                  const selTarget=selStage?(selectedM.setupApplied&&selectedM.adjustedTarget?selectedM.adjustedTarget:selStage.target):null;
                  return [
                    ['Name',selectedM.name],
                    ['Type',BADGE[selectedM.type].lbl],
                    ['Shift',selectedM.shift==='cnc_vmc'?`CNC/VMC — ${viewShift==='night'?'Night':'Day'}`:'Manual'],
                    ['Job',selCt&&selStage?`${selCt.name} — ${selRoute?selRoute.name:''} (${selStage.name})`:selectedM.job||'—'],
                    ['Operator',selectedM.operator],
                    ['Progress',`${selectedM.progress}%`],
                    ['Produced',selectedM.shiftComplete?`${selectedM.prodCount} units${selectedM.newPieces!==undefined?` (${selectedM.newPieces} new, ${selectedM.reworkPieces} rework)`:''}`:selectedM.castingTypeId?'Shift in progress':'—'],
                    ['Target',selStage?`${selTarget} units/shift${selectedM.setupApplied?' (adjusted)':''}`:'—'],
                  ].map(([k,v])=>(
                    <div className="md-row" key={k}>
                      <span className="md-k">{k}</span>
                      <span className="md-v" style={k==='Job'?{color:'var(--accent)'}:{}}>{v}</span>
                    </div>
                  ));
                })()}
                <div className="md-actions">
                  {selectedM.status==='breakdown'&&isAdmin&&<button className="md-btn primary" onClick={()=>setRepairData({machine:selectedM,shiftKey:viewShift})}>Mark repaired</button>}
                  {selectedM.status==='running'&&isAdmin&&<button className="md-btn" onClick={()=>setIdle(selectedM.id,viewShift)}>Set idle</button>}
                  {selectedM.status!=='breakdown'&&<button className="md-btn danger" onClick={()=>setBreakdownData({machine:selectedM,shiftKey:viewShift})}>Report breakdown</button>}
                </div>
                {(()=>{
                  const {ct,stage,route}=resolveStage(castingTypes,selectedM);
                  const isManual=selectedM.shift==='manual';
                  if(!ct||!stage){
                    return (
                      <div className="prod-entry">
                        <div className="prod-entry-title">Production tracking</div>
                        <div className="empty">No job assigned — use Assign jobs to set machine, operator, casting type, route, and step together.</div>
                        {isAdmin&&<button className="md-btn" style={{marginTop:8,width:'100%'}} onClick={()=>setShowAssign(true)}>Open Assign jobs</button>}
                      </div>
                    );
                  }
                  const effectiveTarget=selectedM.setupApplied&&selectedM.adjustedTarget?selectedM.adjustedTarget:stage.target;
                  const effectiveStage=selectedM.setupApplied&&selectedM.adjustedTarget?{...stage,target:selectedM.adjustedTarget}:stage;
                  const shiftKey=isManual?'manual':viewShift;
                  return (
                    <div className="prod-entry">
                      <div className="prod-entry-title">Production tracking</div>
                      <div style={{fontSize:11,color:'var(--text2)',marginBottom:8}}>{ct.name} — {route?route.name:''} ({stage.name}){isManual?<span style={{marginLeft:6,color:'var(--manual)',fontFamily:'var(--mono)',fontSize:9}}>MANUAL</span>:null}</div>
                      <div className="prod-vs">
                        <span>Logged: <b>{selectedM.prodCount}</b></span>
                        <span>Target: <b>{effectiveTarget}</b>/shift{selectedM.setupApplied?' (adj.)':''}</span>
                      </div>
                      {selectedM.setupApplied&&(
                        <div style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--warn)',marginBottom:8}}>⚙ Setup applied: {selectedM.setupHoursUsed}hr — target reduced from {stage.target} to {selectedM.adjustedTarget}</div>
                      )}
                      {selectedM.prodCount>0&&selectedM.newPieces!==undefined&&(
                        <div style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--text2)',marginBottom:8}}>New: {selectedM.newPieces} · Rework: {selectedM.reworkPieces} · Casting defect: {selectedM.castingDefects||0} · Machining defect: {selectedM.machiningDefects||0}</div>
                      )}
                      {selectedM.shiftComplete
                        ?<span className={`shift-done-tag${selectedM.prodCount>=effectiveTarget?' ok':' low'}`}>Shift complete — {selectedM.prodCount>=effectiveTarget?'target met':`short by ${effectiveTarget-selectedM.prodCount}`}</span>
                        :(
                          <div style={{display:'flex',flexDirection:'column',gap:6}}>
                            <button className="md-btn" onClick={()=>setLogProgressData({machine:selectedM,pj:effectiveStage,shiftKey})}>LOG PROGRESS</button>
                            {!isManual&&selectedM.setupApplied&&!selectedM.settingApproved
                              ?(selectedM.settingApprovalStatus==='pending'
                                ?<div className="info-box neutral" style={{marginBottom:0,fontSize:10}}>⏳ Line inspection submitted — awaiting supervisor approval</div>
                                :(
                                  <>
                                    {selectedM.settingApprovalStatus==='disapproved'&&selectedM.settingRejectionNote&&(
                                      <div className="info-box danger" style={{marginBottom:8,fontSize:10}}>✗ Rejected by supervisor: {selectedM.settingRejectionNote} — redo setup and resubmit.</div>
                                    )}
                                    <button className="complete-btn" style={{background:'var(--warn)'}} onClick={()=>setLineInspectionData({machine:selectedM,shiftKey})}>SETTING APPROVED</button>
                                  </>
                                )
                              )
                              :<button className="complete-btn" onClick={()=>setShiftCompleteData({machine:selectedM,pj:effectiveStage,shiftKey})}>MARK SHIFT COMPLETE</button>
                            }
                          </div>
                        )}
                    </div>
                  );
                })()}
              </div>
            )}
          </div>

          <div className="sb-sec">
            <div className="row-between" style={{marginBottom:'.625rem'}}>
              <div className="sb-title" style={{marginBottom:0}}>Live alerts</div>
              {isAdmin&&alerts.length>0&&<button className="small-btn danger" onClick={()=>{if(window.confirm('Clear all alerts?'))clearAllAlerts();}}>Clear all</button>}
            </div>
            {!alerts.length?<div className="empty">No alerts</div>:(
              <div className="alert-list">
                {alerts.map(a=>{
                  if(a.type==='shortfall'&&a.data){
                    return (
                      <div className="al-item shortfall" key={a.id}>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',marginBottom:4}}>
                          <span className="al-msg" style={{color:'var(--danger)'}}>⚠ Shortfall — {a.data.machine}</span>
                          <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                            <span className="al-time">{a.time}</span>
                            {isAdmin&&<button className="al-dismiss" onClick={()=>removeAlert(a.id)}>×</button>}
                          </div>
                        </div>
                        <div style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--text2)',lineHeight:1.8,marginBottom:6,width:'100%'}}>
                          <div>Operator: <b style={{color:'var(--text)'}}>{a.data.operator}</b></div>
                          <div>Job: <b style={{color:'var(--text)'}}>{a.data.job}</b></div>
                          <div>Total: <b style={{color:'var(--danger)'}}>{a.data.produced}</b> / Target: <b style={{color:'var(--text)'}}>{a.data.target}</b> (–{a.data.shortfall})</div>
                          {a.data.newPieces!==undefined&&<div>New: <b style={{color:'var(--text)'}}>{a.data.newPieces}</b> · Rework: <b style={{color:'var(--text)'}}>{a.data.reworkPieces}</b></div>}
                          <div style={{marginTop:4,padding:'5px 7px',background:'var(--bg4)',borderRadius:'var(--r)',color:'var(--text)',fontFamily:'var(--font)',fontSize:11}}>"{a.data.reason}"</div>
                        </div>
                        {isAdmin&&a.data.status==='pending'?(
                          <div style={{display:'flex',gap:5,width:'100%'}}>
                            <button className="md-btn primary" style={{fontSize:10,padding:'6px 8px'}} onClick={()=>setDecisionData({alertId:a.id,decision:'approved'})}>✓ Approve</button>
                            <button className="md-btn danger" style={{fontSize:10,padding:'6px 8px'}} onClick={()=>setDecisionData({alertId:a.id,decision:'disapproved'})}>✗ Disapprove</button>
                          </div>
                        ):a.data.status&&a.data.status!=='pending'?(
                          <div style={{fontSize:10,fontFamily:'var(--mono)',color:a.data.status==='approved'?'var(--accent3)':'var(--danger)',lineHeight:1.6}}>
                            {a.data.status==='approved'?'✓ Approved':'✗ Disapproved'} by {a.data.decidedBy}
                            {a.data.decisionNote&&<div style={{color:'var(--text2)',fontFamily:'var(--font)',fontSize:11,marginTop:2}}>{a.data.decisionNote}</div>}
                          </div>
                        ):(!isAdmin&&<div style={{fontSize:10,color:'var(--text3)',fontFamily:'var(--mono)'}}>Awaiting review</div>)}
                      </div>
                    );
                  }
                  if(a.type==='setting_review'&&a.data){
                    const filledRows=(a.data.rows||[]).filter(r=>r.specification.trim()||r.piece1.trim()||r.piece2.trim());
                    return (
                      <div className="al-item" style={{borderLeft:'3px solid var(--warn)'}} key={a.id}>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',marginBottom:4}}>
                          <span className="al-msg" style={{color:'var(--warn)'}}>⚙ Setting inspection — {a.data.machine}</span>
                          <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                            <span className="al-time">{a.time}</span>
                            {isAdmin&&<button className="al-dismiss" onClick={()=>removeAlert(a.id)}>×</button>}
                          </div>
                        </div>
                        <div style={{fontSize:10,fontFamily:'var(--mono)',color:'var(--text2)',lineHeight:1.8,marginBottom:6,width:'100%'}}>
                          <div>Operator: <b style={{color:'var(--text)'}}>{a.data.operator}</b></div>
                          <div>Shift: <b style={{color:'var(--text)'}}>{a.data.shiftKey==='night'?'Night':'Day'}</b></div>
                          {filledRows.length?filledRows.map(r=>(
                            <div key={r.sr} style={{marginTop:2}}>#{r.sr} {r.specification||'—'}: <b style={{color:'var(--text)'}}>{r.piece1||'—'}</b> / <b style={{color:'var(--text)'}}>{r.piece2||'—'}</b></div>
                          )):<div style={{marginTop:2,color:'var(--text3)'}}>No rows filled in</div>}
                        </div>
                        {isAdmin&&a.data.status==='pending'?(
                          <div style={{display:'flex',gap:5,width:'100%'}}>
                            <button className="md-btn primary" style={{fontSize:10,padding:'6px 8px'}} onClick={()=>setSettingDecisionData({alertId:a.id,decision:'approved'})}>✓ Approve</button>
                            <button className="md-btn danger" style={{fontSize:10,padding:'6px 8px'}} onClick={()=>setSettingDecisionData({alertId:a.id,decision:'disapproved'})}>✗ Reject</button>
                          </div>
                        ):a.data.status&&a.data.status!=='pending'?(
                          <div style={{fontSize:10,fontFamily:'var(--mono)',color:a.data.status==='approved'?'var(--accent3)':'var(--danger)',lineHeight:1.6}}>
                            {a.data.status==='approved'?'✓ Approved':'✗ Rejected'} by {a.data.decidedBy}
                            {a.data.decisionNote&&<div style={{color:'var(--text2)',fontFamily:'var(--font)',fontSize:11,marginTop:2}}>{a.data.decisionNote}</div>}
                          </div>
                        ):(!isAdmin&&<div style={{fontSize:10,color:'var(--text3)',fontFamily:'var(--mono)'}}>Awaiting review</div>)}
                      </div>
                    );
                  }
                  return (
                    <div className={`al-item${a.type==='warn'?' warn':a.type==='info'?' info':''}`} key={a.id}>
                      <div><div className="al-msg">{a.msg}</div><div className="al-time">{a.time}</div></div>
                      {isAdmin&&<button className="al-dismiss" onClick={()=>removeAlert(a.id)}>×</button>}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Root ───────────────────────────────────────────────────
function App() {
  const [users,setUsers]=useState(DEFAULT_USERS);
  const [currentUser,setCurrentUser]=useState(null);
  const [loading,setLoading]=useState(true);
  const [fbReady,setFbReady]=useState(!!window.__firebaseReady);

  useEffect(()=>{
    if(!window.__firebaseReady) window.addEventListener('firebase-ready',()=>setFbReady(true),{once:true});
  },[]);

  useEffect(()=>{
    if(!fbReady) return;
    fb.get('users').then(u=>{
      if(u&&Array.isArray(u)&&u.length>0){
        setUsers(u);
      } else {
        // Do NOT write defaults here. A failed/null read must never overwrite
        // real Firestore data. Just use defaults locally for this session;
        // an admin can fix it via Manage Users, or retry will pick up real data.
        setUsers(DEFAULT_USERS);
      }
      setLoading(false);
    }).catch(()=>{ setUsers(DEFAULT_USERS); setLoading(false); });
  },[fbReady]);

  if(!fbReady||loading) return (
    <>
      <div className="dev-banner">⚠ DEV / TEST BUILD — SAME LIVE DATA AS PRODUCTION ⚠</div>
      <div className="loading-spin">
        Loading FactoryOS…
        <div className="loading-hint">Connecting to Firebase. If this takes more than a few seconds, ensure Firestore is created and your security rules allow read/write.</div>
      </div>
    </>
  );

  return (
    <>
      <div className="dev-banner">⚠ DEV / TEST BUILD — SAME LIVE DATA AS PRODUCTION ⚠</div>
      {!currentUser
        ?<LoginScreen users={users} onLogin={setCurrentUser}/>
        :<Dashboard currentUser={currentUser} users={users} setUsers={setUsers} onLogout={()=>setCurrentUser(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
